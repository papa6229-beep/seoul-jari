name: Audit Commercial Sales History

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-commercial-sales-history.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test audit calculations
        run: node --test build/audit_commercial_sales_comparison.test.js build/audit_commercial_sales_history.test.js
      - name: Compare four quarters
        env:
          SEOUL_OPENAPI_KEY: ${{ secrets.SEOUL_OPENAPI_KEY }}
        run: |
          node build/audit_commercial_sales_history.js
          cat docs/commercial-sales-history-audit.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save report only
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Record four-quarter commercial sales audit'
          file_pattern: docs/commercial-sales-history-audit.md
