name: Update Living Population

on:
  workflow_dispatch:
    inputs:
      date:
        description: '조회할 기준일 YYYYMMDD. 비우면 API 기본 최신값'
        required: false
        default: ''
  schedule:
    - cron: '30 21 * * 2'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test living population scripts
        run: |
          node build/fetch_seoul_openapi.test.js
          node build/fetch_living_population_daily.test.js
      - name: Fetch living population
        env:
          SEOUL_OPENAPI_KEY: ${{ secrets.SEOUL_OPENAPI_KEY }}
          TARGET_DATE: ${{ inputs.date }}
        run: |
          args=()
          if [ -n "$TARGET_DATE" ]; then args+=("--date=$TARGET_DATE"); fi
          node build/fetch_living_population_daily.js "${args[@]}"
      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '서울 생활인구 API 데이터 갱신'
          file_pattern: web/data/living-population-daily-gu.json
