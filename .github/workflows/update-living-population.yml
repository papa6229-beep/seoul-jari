name: Update Living Population

on:
  workflow_dispatch:
    inputs:
      date:
        description: '조회할 기준일 YYYYMMDD. 비우면 API 기본 최신값'
        required: false
        default: ''
      quarter:
        description: '상권분석 유동인구 기준분기 YYYYQ. 예: 20251. 비우면 최신분기'
        required: false
        default: ''
  schedule:
    - cron: '30 21 * * 2'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test living population scripts
        run: |
          node build/fetch_seoul_openapi.test.js
          node build/fetch_living_population_daily.test.js
          node build/fetch_commercial_floating_population.test.js
          node build/fetch_commercial_sales_dong.test.js
          node build/fetch_commercial_stores_dong.test.js
          node build/fetch_commercial_worker_population_dong.test.js
          node build/fetch_commercial_resident_population_dong.test.js
          node build/fetch_commercial_income_consumption_dong.test.js
      - name: Fetch living population
        env:
          SEOUL_OPENAPI_KEY: ${{ secrets.SEOUL_OPENAPI_KEY }}
          TARGET_DATE: ${{ inputs.date }}
          TARGET_QUARTER: ${{ inputs.quarter }}
        run: |
          curl -sS --max-time 10 "http://openapi.seoul.go.kr:8088/sample/json/SPOP_DAILYSUM_JACHI_250/1/1" | head -c 200
          echo
          args=()
          if [ -n "$TARGET_DATE" ]; then args+=("--date=$TARGET_DATE"); fi
          node build/fetch_living_population_daily.js "${args[@]}"
          commercial_args=()
          if [ -n "$TARGET_QUARTER" ]; then commercial_args+=("--quarter=$TARGET_QUARTER"); fi
          node build/fetch_commercial_floating_population.js "${commercial_args[@]}"
          node build/fetch_commercial_sales_dong.js "${commercial_args[@]}"
          node build/fetch_commercial_stores_dong.js "${commercial_args[@]}"
          node build/fetch_commercial_worker_population_dong.js "${commercial_args[@]}"
          node build/fetch_commercial_resident_population_dong.js "${commercial_args[@]}"
          node build/fetch_commercial_income_consumption_dong.js "${commercial_args[@]}"
      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '서울 생활인구 API 데이터 갱신'
          file_pattern: web/data/living-population-daily-gu.json web/data/commercial-floating-population-dong.json web/data/commercial-sales-dong.json web/data/commercial-stores-dong.json web/data/commercial-worker-population-dong.json web/data/commercial-resident-population-dong.json web/data/commercial-income-consumption-dong.json
