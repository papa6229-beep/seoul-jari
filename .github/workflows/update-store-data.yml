name: Update Store Data

on:
  workflow_dispatch:
    inputs:
      limit_gu:
        description: '시험할 구 이름. 비우면 서울 전체 수집'
        required: false
        default: ''
      max_pages:
        description: '시험 최대 페이지 수. 비우면 전체 수집'
        required: false
        default: ''
      quarter:
        description: '기준분기 YYYYQ. 비우면 공통으로 공개된 최신 분기 선택'
        required: false
        default: ''
      verify_only:
        description: '실제 전체 수집과 검사만 실행하고 결과를 커밋하지 않음'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: seoul-jari-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test refresh scripts
        run: node --test build/*.test.js web/commercial-map-data.test.js
      - name: Fetch limited store sample
        if: inputs.limit_gu != '' || inputs.max_pages != ''
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          LIMIT_GU: ${{ inputs.limit_gu }}
          MAX_PAGES: ${{ inputs.max_pages }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$LIMIT_GU" ]; then args+=("--limit-gu=$LIMIT_GU"); fi
          if [ -n "$MAX_PAGES" ]; then args+=("--max-pages=$MAX_PAGES"); fi
          node build/fetch_stores_api.js "${args[@]}" "--out=$RUNNER_TEMP/seoul-jari-store-sample.json"
      - name: Resolve published quarter
        if: inputs.limit_gu == '' && inputs.max_pages == ''
        env:
          SEOUL_OPENAPI_KEY: ${{ secrets.SEOUL_OPENAPI_KEY }}
          TARGET_QUARTER: ${{ inputs.quarter }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$TARGET_QUARTER" ]; then args+=("--quarter=$TARGET_QUARTER"); fi
          selected=$(node build/resolve_commercial_quarter.js "${args[@]}")
          [[ "$selected" =~ ^[0-9]{4}[1-4]$ ]]
          echo "SELECTED_QUARTER=$selected" >> "$GITHUB_ENV"
          echo "Accepted published quarter: $selected"
      - name: Fetch store data
        if: inputs.limit_gu == '' && inputs.max_pages == ''
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          SEOUL_OPENAPI_KEY: ${{ secrets.SEOUL_OPENAPI_KEY }}
        run: |
          set -euo pipefail
          node build/fetch_stores_api.js
          node build/fetch_living_population_daily.js
          for script in floating_population sales_dong stores_dong worker_population_dong resident_population_dong income_consumption_dong change_index_dong apartment_dong facility_dong regional_sales regional_stores; do
            node "build/fetch_commercial_${script}.js" "--quarter=$SELECTED_QUARTER"
          done
          node build/build_commercial_view_data.js
          node build/validate_commercial_view_data.js
          node build/prep_commercial_search.js
          node build/prep_store_points.js
          node build/build_commercial_coverage.js
          python3 build/prep_dates.py
      - name: Guard final data before commit
        if: inputs.limit_gu == '' && inputs.max_pages == ''
        run: |
          set -euo pipefail
          node build/validate_operational_snapshot.js --quarter "$SELECTED_QUARTER"
          node build/validate_data_refresh.js
      - name: Commit updated data
        id: commit
        if: inputs.limit_gu == '' && inputs.max_pages == '' && inputs.verify_only != true
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '상가업소 API 데이터 갱신'
          file_pattern: web/data/store-summary.json web/data/living-population-daily-gu.json web/data/store-points/*.json web/data/commercial-floating-population-dong.json web/data/commercial-sales-dong.json web/data/commercial-stores-dong.json web/data/commercial-worker-population-dong.json web/data/commercial-resident-population-dong.json web/data/commercial-income-consumption-dong.json web/data/commercial-change-index-dong.json web/data/commercial-apartment-dong.json web/data/commercial-facility-dong.json web/data/commercial-sales-signgu.json web/data/commercial-sales-mega.json web/data/commercial-sales-trdar.json web/data/commercial-sales-trdhl.json web/data/commercial-stores-signgu.json web/data/commercial-stores-mega.json web/data/commercial-stores-trdar.json web/data/commercial-stores-trdhl.json web/data/commercial-view-dong.json web/data/commercial-search-index.json web/data/commercial-coverage.json web/data/dates.json
      - name: Refresh existing GitHub Pages
        if: github.ref == 'refs/heads/main' && steps.commit.outputs.changes_detected == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_DATA_COMMIT: ${{ steps.commit.outputs.commit_hash }}
        run: node build/refresh_existing_pages.js
