<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>상권 데이터 — 서울자리</title>
<link rel="stylesheet" href="styles.css?v=133">
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=0d6d1f6f1bf11cb9d1c630cf365f8a2c&autoload=false"></script>
<script>
(function(){
  var PAGE_V = '133';
  fetch('version.json?t=' + Date.now(), {cache: 'no-store'})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){
      if (!d || d.v === PAGE_V) return;
      var key = 'reloaded-' + d.v;
      try { if (sessionStorage.getItem(key)) return; sessionStorage.setItem(key, '1'); } catch (e) { return; }
      location.reload();
    })
    .catch(function(){});
})();
</script>
</head>
<body>
<div class="app commercial-app">
  <aside class="side">
    <a class="home-link" href="index.html">← 메뉴</a>
    <h1>상권 데이터</h1>
    <p class="where">행정동 기준 · 상권분석서비스 자동갱신 데이터</p>

    <div class="field">
      <label for="biz">업종</label>
      <select class="pick" id="biz">
        <option value="svc_CS100010">커피-음료</option>
      </select>
    </div>

    <div class="field">
      <label for="dongPick">행정동 선택</label>
      <select class="pick" id="dongPick">
        <option value="">전체 행정동</option>
      </select>
    </div>

    <div class="field">
      <label for="q">행정동 검색</label>
      <input class="search" id="q" type="search" placeholder="예: 성수, 잠실7동, 강남구">
    </div>

    <div class="field">
      <label for="sortPick">정렬</label>
      <select class="pick" id="sortPick"></select>
      <small class="qhint" id="sortHelp"></small>
    </div>

    <p class="side-note">한 화면에 10개씩 보여줍니다. 행을 누르면 상세 기준이 바뀝니다.</p>
  </aside>

  <main class="main">
    <div class="topbar">
      <details class="dates" data-dates><summary>자료 기준일</summary></details>
    </div>

    <div class="commercial-summary compact" id="summary"></div>
    <div class="commercial-alert" id="alert" hidden></div>
    <section class="commercial-table" id="table"></section>
    <nav class="detail-tabs" id="detailTabs"></nav>
    <section class="detail commercial-detail" id="detail"></section>

    <p class="note">이 화면은 후보지를 좁히는 참고용입니다. 임대차 계약, 창업, 투자 판단은 현장 조사와 전문가 검토가 필요합니다.</p>
  </main>
</div>

<script src="dong-sales-estimate.js?v=133"></script>
<script src="commercial-reference.js?v=133"></script>
<script src="commercial-map-data.js?v=133"></script>
<script>
const V = '133';
const FILES = {
  view: 'commercial-view-dong.json',
  places: 'places/index.json',
  stores: 'store-summary.json',
  coverage: 'commercial-coverage.json',
  tasis: 'tasis-living-business-seoul.json'
};
const BIZ = {
  svc_CS100010: {
    label: '커피-음료',
    words: ['커피', '음료'],
    demand: ['유동인구', '20~40대 상주·직장인', '식료품·음식 소비'],
    caution: '카페는 임대료와 체류 동선 영향이 큽니다. 매출이 높아도 경쟁 점포 수를 같이 봅니다.'
  },
  cafe: {
    label: '커피·제과·패스트푸드 묶음',
    words: ['커피', '음료', '제과', '패스트푸드'],
    demand: ['유동인구', '20~40대 상주·직장인', '식료품·음식 소비'],
    caution: '카페는 임대료와 체류 동선 영향이 큽니다. 매출이 높아도 경쟁 점포 수를 같이 봅니다.'
  },
  food: {
    label: '분식 · 김밥 · 식사',
    words: ['한식', '분식', '김밥', '패스트푸드', '중식', '일식', '양식'],
    demand: ['점심 유동', '직장인구', '음식 소비'],
    caution: '점심형 업종은 11~14시 신호와 직장인구가 중요합니다. 배달 플랫폼 노출은 별도 확인이 필요합니다.'
  },
  fitness: {
    label: '운동시설·강습 묶음',
    words: ['스포츠 강습', '스포츠클럽', '헬스', '체육'],
    demand: ['20~40대 상주·직장인', '저녁 유동', '여가·문화 소비'],
    caution: '건물 조건, 샤워실, 층고, 방음, 주차는 공공데이터로 판단할 수 없습니다.'
  },
  academy: {
    label: '학원 · 교습소',
    words: ['학원', '교습', '교육', '예술학원', '외국어'],
    demand: ['10대 상주인구', '교육 소비', '기존 교육업 점포'],
    caution: '행정동 상권자료와 학원 인허가 자료는 기준이 다릅니다. 최종 판단은 기존 입지 분석 화면과 함께 봅니다.'
  },
  unmanned: {
    label: '생활소매·세탁 묶음',
    words: ['편의점', '슈퍼', '문구', '세탁', '생활용품'],
    demand: ['상주인구', '야간·저녁 유동', '가구 수'],
    caution: '이 통계는 무인 여부를 구분하지 않습니다. 무인 운영에 필요한 관리·치안 조건은 현장에서 확인해야 합니다.'
  }
};

const state = {
  biz: new URLSearchParams(location.search).get('biz') || 'svc_CS100010',
  dong: new URLSearchParams(location.search).get('dong') || '',
  q: '',
  sort: new URLSearchParams(location.search).get('sort') || 'sales_per_store_month',
  picked: new URLSearchParams(location.search).get('dong') || '',
  tab: new URLSearchParams(location.search).get('tab') || 'summary',
  sortDir: 'desc', page: 1, pageSize: 10,
  show: {business: true, school: false, academy: false, apartment: true, shop: true}
};
const DATA = {};
let ROWS = [];
let dongSalesEstimator = null;
const SORTS = [
  {k:'sales_per_store_month', l:'가게 1곳 월평균 매출', help:'이 동네에서 같은 업종 가게 1곳이 한 달 평균 얼마나 파는지 보는 값입니다.'},
  {k:'stores', l:'같은 업종 가게 수', help:'같은 업종 가게가 많은 동네부터 봅니다. 손님도 많을 수 있지만 경쟁도 셉니다.'},
  {k:'competition_score', l:'경쟁 덜한 곳', help:'같은 업종 가게가 비교적 적은 동네부터 봅니다. 매출도 같이 확인해야 합니다.'},
  {k:'workers', l:'직장인구', help:'평일 낮에 이 동네에서 일하는 사람이 많은 순서입니다.'},
  {k:'residents', l:'거주인구', help:'이 동네에 사는 사람이 많은 순서입니다.'}
];
const TABS = [
  {k:'summary', l:'요약'},
  {k:'sales', l:'매출·경쟁'},
  {k:'demand', l:'수요'},
  {k:'analysis', l:'분석'},
  {k:'map', l:'지도'},
  {k:'checks', l:'확인사항'}
];

function escapeHtml(v){
  return String(v || '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

const fmt = n => n === null || n === undefined ? '—' : n.toLocaleString('ko-KR');
const count = (n, unit) => (n === null || n === undefined ? 0 : n).toLocaleString('ko-KR') + unit;
const withUnit = (n, unit) => n === null || n === undefined ? '자료 없음' : fmt(n) + unit;
const plainScope = scope => scope === '자치구' ? '구 전체' : (scope || '');
function scopeLabel(scope, row){
  if (scope === '자치구') return (row && row.gu ? row.gu : '구') + ' 전체';
  return scope || '';
}
const pct = n => n === null || n === undefined ? '—' : Math.round(n) + '%';
const money = n => {
  if (!n) return '—';
  if (n >= 100000000) return (n / 100000000).toFixed(1).replace(/\.0$/, '') + '억';
  return Math.round(n / 10000).toLocaleString('ko-KR') + '만원';
};
const manwonMoney = n => {
  if (!n) return '자료 없음';
  if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '억원';
  return Math.round(n).toLocaleString('ko-KR') + '만원';
};
const shortMoney = n => {
  if (!n) return '—';
  if (n >= 100000000) return (n / 100000000).toFixed(1).replace(/\.0$/, '') + '억';
  return Math.round(n / 10000).toLocaleString('ko-KR') + '만';
};
const quarterLabel = q => {
  const v = String(q || '');
  return /^\d{5}$/.test(v) ? v.slice(0, 4) + '년 ' + v.slice(4) + '분기' : '최신 분기';
};

function syncSegments(){
  if (!hasComparableSalesData() && state.sort === 'sales_per_store_month') state.sort = 'stores';
  const salesOption = sortPick.querySelector('option[value="sales_per_store_month"]');
  if (salesOption){
    salesOption.disabled = !hasComparableSalesData();
    salesOption.textContent = !hasSalesData() && hasEstimatedSalesData() ? '1곳 추정 월평균 매출' : '가게 1곳 월평균 매출';
  }
  sortPick.value = state.sort;
}

function serviceCaution(label){
  return label + ' 기준으로 매출·가게 수·수요를 봅니다. 행정동 매출이 없으면 가게 수와 수요부터 비교합니다.';
}

function coverageFor(id = state.biz){
  const items = DATA.coverage && Array.isArray(DATA.coverage.items) ? DATA.coverage.items : [];
  return items.find(item => item.id === id) || null;
}

function hasSalesData(){
  const c = coverageFor();
  return c ? !!c.has_sales : ROWS.some(r => r.sales);
}

function hasEstimatedSalesData(){
  return ROWS.some(row => row.estimated_sales_per_store_month);
}

function hasComparableSalesData(){
  return hasSalesData() || hasEstimatedSalesData();
}

function rowHasSales(row){
  return !!(row && row.sales_per_store_month);
}

function rowSalesValue(row){
  if (!row) return 0;
  return row.sales_per_store_month || row.estimated_sales_per_store_month || 0;
}

function businessHasAnySales(){
  return ROWS.some(row => row.sales_per_store_month);
}

function hasMapData(){
  const c = coverageFor();
  return c ? !!c.has_map_points : false;
}

function salesMissingText(){
  const picked = ROWS.find(r => r.code === state.picked);
  const ref = (picked && picked.reference_sales) || currentReferenceSales();
  if (ref && ref.monthly_sales_per_store){
    return '이 행정동의 카드매출 자료는 없지만 ' + scopeLabel(ref.scope, picked) + ' 가게 1곳 월평균 매출을 참고값으로 보여줍니다.';
  }
  return '이 업종은 행정동 매출이 없어 가게 수와 수요부터 비교합니다.';
}

function referenceText(ref){
  if (!ref || !ref.monthly_sales_per_store) return '';
  return plainScope(ref.scope) + ' 기준 가게 1곳의 한 달 참고 매출 ' + money(ref.monthly_sales_per_store) +
    (ref.customer_unit_price ? ', 손님 1명이 보통 쓰는 돈 ' + fmt(ref.customer_unit_price) + '원' : '');
}

function normalizeBizName(name){
  return String(name || '')
    .replace(/[ㆍ·\s]/g, '')
    .replace(/사무소$/g, '')
    .replace(/점$/g, '')
    .toLowerCase();
}

function tasisAliasName(id, label){
  if (id === 'svc_CS100010') return '커피음료점';
  if (label === '커피-음료') return '커피음료점';
  return '';
}

function tasisForCurrentBusiness(){
  const payload = DATA.tasis || {};
  const rows = Array.isArray(payload.rows) ? payload.rows : [];
  const mappings = Array.isArray(payload.missing_38_mapping) ? payload.missing_38_mapping : [];
  const label = BIZ[state.biz] && BIZ[state.biz].label;
  if (!label) return null;
  const mapped = mappings.find(item => item.missing_industry_name === label && item.tasis_industry_code);
  const alias = tasisAliasName(state.biz, label);
  const code = mapped && String(mapped.tasis_industry_code).padStart(3, '0');
  const row = code
    ? rows.find(item => String(item.industry_code).padStart(3, '0') === code)
    : rows.find(item => normalizeBizName(item.industry_name) === normalizeBizName(alias || label));
  if (!row) return null;
  return {
    row,
    status: mapped ? mapped.match_status : (alias ? 'equivalent' : 'exact'),
    note: mapped ? mapped.note : (alias ? label + '와 정확히 같은 분류는 아니지만 가까운 국세청 생활업종입니다.' : ''),
    label
  };
}

function tasisStatusText(status){
  if (status === 'exact') return '같은 업종';
  if (status === 'equivalent') return '거의 같은 업종';
  if (status === 'broader_category') return '넓은 업종 참고';
  return '국세청 참고';
}

function showTasisCard(tasis){
  return !!(tasis && (tasis.status === 'exact' || tasis.status === 'equivalent'));
}

function tasisReferenceValue(tasis){
  if (!showTasisCard(tasis) || !Number.isFinite(tasis.row.avg_monthly_sales_manwon)) return null;
  return {
    scope: '국세청 서울 평균',
    monthly_sales_per_store: Math.round(tasis.row.avg_monthly_sales_manwon * 10000),
    industry_name: tasis.row.industry_name,
    status: tasis.status
  };
}

function currentReferenceSales(){
  const biz = BIZ[state.biz] || {};
  return biz.reference_sales || tasisReferenceValue(tasisForCurrentBusiness());
}

function isAggregateBusinessId(id){
  return ['cafe', 'food', 'fitness', 'academy', 'unmanned'].includes(id);
}

function tasisReferenceCard(tasis, compact){
  if (!tasis || !tasis.row) return '';
  const row = tasis.row;
  const age = row.avg_business_age_year || row.avg_business_age_month
    ? fmt(row.avg_business_age_year || 0) + '년 ' + fmt(row.avg_business_age_month || 0) + '개월'
    : '자료 없음';
  const trend = Number.isFinite(row.sales_yoy_rate)
    ? (row.sales_yoy_rate > 0 ? '+' : '') + row.sales_yoy_rate + '%'
    : '자료 없음';
  const countText = row.business_count ? fmt(row.business_count) + '명' : '자료 없음';
  const title = compact ? '서울 전체 참고자료' : '서울 전체 참고자료';
  const description = (row.sales_tax_year || '') + '년 귀속 연매출 · ' +
    (row.business_count_year || '') + '년 말 사업자 수 기준입니다.';
  return '<div class="tasis-card ' + (compact ? 'compact' : '') + '">' +
    '<div class="tasis-head"><span>' + title + '</span><b>' + escapeHtml(row.industry_name) + '</b><em>' + tasisStatusText(tasis.status) + '</em></div>' +
    '<div class="tasis-metrics">' +
      '<span><b>' + manwonMoney(row.avg_monthly_sales_manwon) + '</b><small>가게 1곳 월평균 매출</small></span>' +
      '<span><b>' + manwonMoney(row.avg_annual_sales_manwon) + '</b><small>가게 1곳 평균 연매출</small></span>' +
      '<span><b>' + countText + '</b><small>국세청 서울 신고 사업자 수</small></span>' +
      (compact ? '' : '<span><b>' + trend + '</b><small>전년 대비</small></span><span><b>' + age + '</b><small>평균 운영 기간</small></span>') +
    '</div>' +
    (compact ? '' : '<p>' + description + ' 개별 가게나 행정동 매출이 아니라 서울 전체 평균 참고값입니다.</p>') +
    (tasis.note && !compact ? '<p class="tasis-note">' + escapeHtml(tasis.note) + '</p>' : '') +
  '</div>';
}

function businessMeta(){
  return (DATA.view && Array.isArray(DATA.view.business_types) ? DATA.view.business_types : [])
    .find(item => item.id === state.biz) || {};
}

function bizLabel(id, item){
  if (item && item.business_name) return item.business_name;
  if (item && item.label) return item.label;
  const meta = (DATA.view && Array.isArray(DATA.view.business_types) ? DATA.view.business_types : [])
    .find(type => type.id === id);
  return (meta && meta.label) || (BIZ[id] && BIZ[id].label) || id || '이름 없음';
}

function topMarketList(items){
  if (!items || !items.length) return '<li>참고 상권 자료 없음</li>';
  return items.slice(0, 5).map(item =>
    '<li><b>' + escapeHtml(item.area_name || '이름 없음') + '</b><span>' +
    shortMoney(item.monthly_sales_per_store) + '/월</span><small>' +
    escapeHtml([item.market_type_name, count(item.stores, '곳'), item.customer_unit_price ? '손님 1명이 보통 쓰는 돈 ' + fmt(item.customer_unit_price) + '원' : ''].filter(Boolean).join(' · ')) +
    '</small></li>'
  ).join('');
}

function coverageLabel(cov){
  if (!cov) return '자료 상태 확인 중';
  if (!cov.has_sales && cov.has_reference_sales) return '행정동 매출 없음 · 서울 평균 참고 가능';
  return cov.coverage_label || [
    cov.has_sales ? '행정동 매출 있음' : '행정동 매출 없음',
    cov.has_stores ? '가게 수 있음' : '가게 수 없음',
    cov.has_map_points ? '지도 지점 있음' : '지도 지점 없음'
  ].join(' · ');
}

function coverageAction(cov){
  if (!cov) return '업종별 자료 상태를 불러오는 중입니다.';
  if (!cov.has_sales && cov.has_reference_sales) return '행정동 매출은 없습니다. 서울 평균은 참고값으로만 보여줍니다.';
  return cov.recommended_action || (cov.has_sales
    ? '행정동별 매출과 가게 수를 같이 볼 수 있습니다.'
    : '행정동 매출은 없어서 가게 수와 수요부터 비교합니다.');
}

function coverageClass(cov){
  const level = cov && cov.coverage_level ? cov.coverage_level : 'limited';
  return 'coverage-' + level;
}

function renderCoverageBox(){
  if (typeof coverageBox === 'undefined' || !coverageBox) return;
  const cov = coverageFor();
  const parts = cov ? [
    cov.has_sales ? '행정동 매출 ' + fmt(cov.sales_dongs) + '개 동' : '행정동 매출 없음',
    cov.has_reference_sales ? '서울 평균 참고 가능' : '',
    cov.has_stores ? '가게 수 ' + fmt(cov.store_dongs) + '개 동' : '가게 수 없음',
    cov.has_map_points ? '관련 업소 지도 지점 ' + fmt(cov.map_points) + '개' : '지도 지점 없음'
  ].filter(Boolean) : ['자료 확인 중'];
  coverageBox.className = 'coverage-box ' + coverageClass(cov);
  coverageBox.innerHTML =
    '<span>데이터 상태</span>' +
    '<b>' + escapeHtml(coverageLabel(cov)) + '</b>' +
    '<p>' + escapeHtml(parts.join(' · ')) + '</p>' +
    '<small>' + escapeHtml(coverageAction(cov)) + '</small>';
}

function applyBusinessTypes(){
  const types = Array.isArray(DATA.view && DATA.view.business_types) ? DATA.view.business_types : [];
  for (const item of types){
    if (BIZ[item.id]){
      if (item.reference_sales) BIZ[item.id].reference_sales = item.reference_sales;
      continue;
    }
    BIZ[item.id] = {
      label: item.label,
      words: item.words || [item.label],
      demand: ['유동인구', '직장인구', '상주인구', '소비지출'],
      caution: serviceCaution(item.label),
      kind: item.kind,
      code: item.code,
      reference_sales: item.reference_sales || null
    };
    if (item.reference_sales) BIZ[item.id].reference_sales = item.reference_sales;
  }
  const groupOrder = ['추천 업종', '전체 업종'];
  const preferredRecommended = ['svc_CS100010', 'cafe', 'food', 'fitness', 'academy', 'unmanned'];
  const byGroup = new Map();
  for (const item of types){
    let group = item.group || (item.kind === 'service' ? '전체 업종' : '추천 업종');
    if (group === '매출 자료 있는 업종' || group === '매출 자료 없는 업종') group = '전체 업종';
    if (item.id === 'svc_CS100010') group = '추천 업종';
    if (!byGroup.has(group)) byGroup.set(group, []);
    byGroup.get(group).push(item);
  }
  if (byGroup.has('추천 업종')){
    byGroup.get('추천 업종').sort((a, b) => {
      const ai = preferredRecommended.indexOf(a.id);
      const bi = preferredRecommended.indexOf(b.id);
      return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
    });
  }
  if (!types.length){
    byGroup.set('추천 업종', Object.keys(BIZ).map(id => ({id, label: BIZ[id].label})));
  }
  biz.innerHTML = groupOrder.concat([...byGroup.keys()].filter(g => !groupOrder.includes(g))).filter(g => byGroup.has(g)).map(group => {
    const options = byGroup.get(group).map(item =>
      '<option value="' + escapeHtml(item.id) + '">' + escapeHtml(item.label) + '</option>'
    ).join('');
    return '<optgroup label="' + escapeHtml(group) + '">' + options + '</optgroup>';
  }).join('');
  if (!BIZ[state.biz]) state.biz = 'svc_CS100010';
}

function latestRows(payload){
  return payload && Array.isArray(payload.rows) ? payload.rows : [];
}

function norm(v, min, max, inverse){
  if (v === null || v === undefined || !Number.isFinite(v)) return 0;
  if (max <= min) return 50;
  const p = Math.max(0, Math.min(100, ((v - min) / (max - min)) * 100));
  return inverse ? 100 - p : p;
}

function level(value, rows, key, high, mid, low){
  const vals = rows.map(r => r[key]).filter(v => Number.isFinite(v));
  if (!Number.isFinite(value) || vals.length < 3) return low;
  vals.sort((a, b) => a - b);
  const top = vals[Math.floor(vals.length * .75)];
  const middle = vals[Math.floor(vals.length * .45)];
  if (value >= top) return high;
  if (value >= middle) return mid;
  return low;
}

function median(rows, key){
  const vals = rows.map(r => r[key]).filter(v => Number.isFinite(v)).sort((a, b) => a - b);
  if (!vals.length) return 0;
  return vals[Math.floor(vals.length / 2)];
}

function buildRows(){
  const base = latestRows(DATA.view).map(src => {
    const biz = (src.biz && src.biz[state.biz]) || {};
    const allBiz = Object.entries(src.biz || {});
    const demand = (src.floating || 0) + (src.workers || 0) * 800 + (src.residents || 0) * 250;
    const usableSales = biz.sales_incomplete ? null : (biz.sales || null);
    const unitPrice = usableSales && biz.sales_count ? Math.round(usableSales / biz.sales_count) : null;
    return {
      code: src.code, gu: src.gu, name: src.name, full_name: src.full_name,
      floating: src.floating || null,
      lunch_flow: src.lunch_flow || null,
      evening_flow: src.evening_flow || null,
      workers: src.workers || null,
      residents: src.residents || null,
      households: src.households || null,
      core_people: src.core_people || null,
      spending: src.spending || null,
      food_spending: src.food_spending || null,
      education_spending: src.education_spending || null,
      leisure_spending: src.leisure_spending || null,
      sales: usableSales,
      sales_month: usableSales ? Math.round(usableSales / 3) : null,
      sales_count: usableSales ? (biz.sales_count || null) : null,
      unit_price: unitPrice,
      sales_incomplete: !!biz.sales_incomplete,
      stores: biz.stores || null,
      independent_stores: biz.independent_stores ?? null,
      sales_per_store: usableSales && biz.stores ? Math.round(usableSales / biz.stores) : null,
      sales_per_store_month: usableSales && biz.stores ? Math.round(usableSales / biz.stores / 3) : null,
      franchises: biz.franchises ?? null,
      open: biz.open ?? null,
      close: biz.close ?? null,
      market_change: src.market_change || null,
      apartment: src.apartment || null,
      facilities: src.facilities || null,
      demand_raw: demand,
      sales_items: biz.sales_items || [],
      store_items: biz.store_items || [],
      all_sales_items: allBiz
        .filter(([, item]) => item.sales && item.stores && !item.sales_incomplete)
        .map(([id, item]) => ({
          id,
          business_name: bizLabel(id, item),
          amount: item.sales,
          stores: item.stores,
          monthly_per_store: Math.round(item.sales / item.stores / 3)
        }))
        .sort((a, z) => (z.monthly_per_store || 0) - (a.monthly_per_store || 0)),
      all_store_items: allBiz
        .filter(([, item]) => item.stores)
        .map(([id, item]) => ({id, business_name: bizLabel(id, item), store_count: item.stores, sales: item.sales}))
        .sort((a, z) => (z.store_count || 0) - (a.store_count || 0)),
      reference_sales: biz.reference_sales || null
    };
  });

  const makeReference = (scope, amount, count, stores) => {
    if (!amount || !stores) return null;
    return {
      scope,
      amount,
      count,
      stores,
      monthly_sales_per_store: Math.round(amount / stores / 3),
      customer_unit_price: count ? Math.round(amount / count) : null
    };
  };
  const seoulSum = base.reduce((acc, r) => {
    acc.amount += r.sales || 0;
    acc.count += r.sales_count || 0;
    acc.stores += r.stores || 0;
    if (r.stores && !r.sales) acc.missingStoreSales = true;
    return acc;
  }, {amount: 0, count: 0, stores: 0, missingStoreSales: false});
  const seoulReference = currentReferenceSales() ||
    (!seoulSum.missingStoreSales ? makeReference('서울 전체', seoulSum.amount, seoulSum.count, seoulSum.stores) : null);
  const guSums = new Map();
  const officialGuRefs = new Map();
  for (const r of base){
    if (!guSums.has(r.gu)) guSums.set(r.gu, {amount: 0, count: 0, stores: 0, missingStoreSales: false});
    const acc = guSums.get(r.gu);
    acc.amount += r.sales || 0;
    acc.count += r.sales_count || 0;
    acc.stores += r.stores || 0;
    if (r.stores && !r.sales) acc.missingStoreSales = true;
    if (r.reference_sales && r.reference_sales.scope === '자치구') officialGuRefs.set(r.gu, r.reference_sales);
  }
  for (const r of base){
    const gu = guSums.get(r.gu);
    r.reference_sales = officialGuRefs.get(r.gu) ||
      (!gu.missingStoreSales ? makeReference('자치구', gu.amount, gu.count, gu.stores) : null) ||
      seoulReference;
    r.reference_comparable = CommercialReference.assessReference(r.reference_sales, gu).comparable;
  }

  const tasis = tasisForCurrentBusiness();
  const tasisBase = !base.some(r => r.sales_per_store_month) && showTasisCard(tasis) && Number.isFinite(tasis.row.avg_monthly_sales_manwon)
    ? Math.round(tasis.row.avg_monthly_sales_manwon * 10000) : null;
  for (const r of base){
    const estimate = !r.sales_per_store_month && dongSalesEstimator && tasisBase
      ? dongSalesEstimator.forDong(state.biz, r.code, tasisBase) : null;
    r.estimated_sales_per_store_month = estimate ? estimate.monthly_won : null;
    r.estimate_details = estimate;
  }

  const rangeFrom = fn => {
    const vals = base.map(fn).filter(v => Number.isFinite(v));
    return vals.length ? {min: Math.min(...vals), max: Math.max(...vals)} : {min: 0, max: 0};
  };
  const ranges = {};
  ['demand_raw','sales','spending','core_people','workers','residents'].forEach(k => {
    ranges[k] = rangeFrom(r => r[k]);
  });
  ranges.stores = rangeFrom(r => competitionStoreValue(r));
  base.forEach(r => {
    const demand = norm(r.demand_raw, ranges.demand_raw.min, ranges.demand_raw.max);
    const revenue = norm(r.sales || 0, ranges.sales.min, ranges.sales.max);
    const spending = norm(r.spending || 0, ranges.spending.min, ranges.spending.max);
    const core = norm(r.core_people || 0, ranges.core_people.min, ranges.core_people.max);
    const competition = norm(competitionStoreValue(r), ranges.stores.min, ranges.stores.max, true);
    r.competition_score = Math.round(competition);
    r.score = r.sales
      ? Math.round(demand * .32 + revenue * .28 + spending * .18 + competition * .22)
      : Math.round(demand * .36 + spending * .24 + core * .16 + competition * .24);
  });
  ROWS = base;
}

  if (!worker && !resident) return '인구 자료 없음';

  if (resident > worker * 2) return '거주인구 우세';
  return '거주·직장 비슷';
}

function mainCaution(row){
  if (!row) return '자료 확인 필요';
  const referenceMonthly = row.reference_sales && row.reference_sales.monthly_sales_per_store;
  const comparable = row.reference_comparable;
  const salesRatio = comparable && row.sales_per_store_month && referenceMonthly ? row.sales_per_store_month / referenceMonthly : null;
  const salesRankStrong = comparable && row.sales_per_store_month && referenceMonthly && row.sales_per_store_month >= referenceMonthly * 1.5 && row.score < 45;
  if (salesRatio && salesRatio >= 2.5) return '매출 높음 · 이유 확인';
  if (salesRankStrong) return '매출 높음 · 다른 지표 낮음';
  if ((row.franchises || 0) && row.stores && row.franchises <= row.stores && row.franchises / row.stores >= .7) return '브랜드 경쟁 강함';
  if (competitionStoreValue(row) >= 100) return '같은 업종 많음';
  return scoreLabel(row);
}

function scoreShortLabel(r){

function competitionGuide(r){

  if (r.competition_score >= 35) return '경쟁은 보통 수준입니다. 상권 안쪽 위치 차이가 결과를 크게 가를 수 있습니다.';
  return '선택 업종 점포가 많은 편입니다. 가격·콘셉트·노출 위치로 이길 수 있는지 먼저 봐야 합니다.';
}

function competitionCounts(row){
  const stores = row && row.stores ? row.stores : null;
  const franchises = row && row.franchises ? row.franchises : 0;
  const independent = row && row.independent_stores !== null && row.independent_stores !== undefined
    ? row.independent_stores : (stores === null ? null : Math.max(0, stores - franchises));
  return {
    total: stores,
    stores: independent,
    franchises,
    split: !!(stores && franchises)
  };
}

function competitionStoreValue(row){
  return competitionCounts(row).total || 0;
}

function competitionCountText(row){
  const c = competitionCounts(row);
  return c.total ? fmt(c.total) + '곳' : '자료 없음';
}

function franchiseShareText(row){

  const pctText = Math.round((row.franchises / row.stores) * 100);
  const share = row.franchises / row.stores;
  const label = share > .5 ? '브랜드가 더 많음' : (share >= .35 ? '브랜드 섞임' : '일반 가게 중심');

function salesReferenceTone(row){
  const referenceMonthly = row && row.reference_sales && row.reference_sales.monthly_sales_per_store;
  if (!row || !row.sales_per_store_month || !referenceMonthly || !row.reference_comparable) return '';
  const ratio = row.sales_per_store_month / referenceMonthly;
  const label = scopeLabel(row.reference_sales.scope, row);
  if (ratio >= 2.5) return label + ' 평균보다 크게 높습니다. 여러 가게의 합산 매출을 나눈 값이며 개별 가게 매출은 아닙니다.';

function filteredRows(){
  const q = state.q.trim();
  let out = ROWS;
  if (state.dong) out = out.filter(r => r.code === state.dong);
  if (q) out = out.filter(r => (r.full_name + ' ' + r.gu + ' ' + r.name).includes(q));
  out = out.filter(r => r.score || r.sales || competitionStoreValue(r) || r.floating || r.workers || r.residents);
  const key = state.sort;
  if (key === 'sales_per_store_month'){
    const salesValue = r => rowSalesValue(r);
    const withSales = out.filter(r => salesValue(r));
    const withoutSales = out.filter(r => !salesValue(r));
    withSales.sort((a, b) => {
      const diff = state.sortDir === 'asc' ? salesValue(a) - salesValue(b) : salesValue(b) - salesValue(a);
      return diff || a.code.localeCompare(b.code);
    });
    withoutSales.sort((a, b) => a.code.localeCompare(b.code));
    return withSales.concat(withoutSales);
  }
  out = out.slice().sort((a, b) => {
    const av = key === 'stores' ? competitionStoreValue(a) : (a[key] || 0);
    const bv = key === 'stores' ? competitionStoreValue(b) : (b[key] || 0);
    const diff = state.sortDir === 'asc' ? av - bv : bv - av;
    return diff || a.code.localeCompare(b.code);
  });
  return out;
}

const PLACE_CACHE = {};
let kakaoReady = false, commercialMap = null, commercialOverlays = [], commercialMapKey = '';

function cleanPlaceName(v){
  return (v || '').replace(/[^0-9A-Za-z가-힣]+/g, '');
}

function legalDongName(name){
  return (name || '').replace(/(\d+(?:\.\d+)*)동$/, '동');
}

function placeFileFor(row){
  const idx = DATA.places && DATA.places.dongs ? DATA.places.dongs : {};
  const names = [row.name, legalDongName(row.name)];
  for (const name of names){
    const key = '서울/' + row.gu + '/' + name;
    if (idx[key] && idx[key].f) return idx[key].f + '.json';
  }
  return cleanPlaceName('서울') + '_' + cleanPlaceName(row.gu) + '_' + cleanPlaceName(legalDongName(row.name)) + '.json';
}

function loadKakao(){
  return new Promise((resolve, reject) => {
    if (kakaoReady) return resolve();
    if (!window.kakao || !window.kakao.maps) return reject(new Error('sdk'));
    kakao.maps.load(() => { kakaoReady = true; resolve(); });
  });
}

function loadPlaces(row){
  const file = placeFileFor(row);
  if (PLACE_CACHE[file]) return Promise.resolve(PLACE_CACHE[file]);
  return fetch('data/places/' + encodeURIComponent(file) + '?v=' + V, {cache:'no-store'})
    .then(r => r.ok ? r.json() : null)
    .then(d => (PLACE_CACHE[file] = d))
    .catch(() => null);
}

function markerCard(p){
  if (p.t === 'b'){
    if (Array.isArray(p.members) && p.members.length > 1){
      const list = p.members.map(item =>
        '<div class="li"><u>' + item.n + '</u>' +
          '<small>' + [item.c || BIZ[state.biz].label, item.a || ''].filter(Boolean).join(' · ') + '</small></div>'
      ).join('');
      const salesNote = p.sales_note ? '<span><b>매출 기준</b> ' + p.sales_note + '</span>' : '';
      return '<b>같은 위치 ' + p.members.length + '곳</b>' + salesNote + list;
    }
    const meta = [
      '<span><b>업종</b> ' + (p.c || BIZ[state.biz].label) + '</span>',
      p.sales_note ? '<span><b>매출 기준</b> ' + p.sales_note + '</span>' : '',
      p.a ? '<span><b>주소</b> ' + p.a + '</span>' : ''
    ].filter(Boolean).join('');
    return '<b>' + p.n + '</b>' + meta;
  }
  const sub = [];
  if (p.t === 's') sub.push(p.k, p.st ? '학생 ' + fmt(p.st) + '명' : '');
  if (p.t === 'a') sub.push(p.k, p.y ? p.y + '년 개원' : '', p.f ? '월 ' + Math.round(p.f / 10000) + '만원' : '');
  if (p.t === 'p') sub.push('아파트', p.y ? p.y + '년' : '', p.p ? '중간가 ' + money(p.p) : '');
  if (p.t === 'g') sub.push('상가', p.k, p.ar ? Math.round(p.ar / 3.3) + '평' : '');
  return '<b>' + p.n + '</b>' + sub.filter(Boolean).map(v => '<span>' + v + '</span>').join('');
}

function mapSelectionTitle(p){
  if (!p) return '지도 핀을 눌러보세요';
  if (p.t === 'b') return p.count > 1 ? '같은 위치 ' + p.members.length + '곳' : '선택한 가게';
  if (p.t === 'p') return '선택한 아파트';
  if (p.t === 'g') return '선택한 상가';
  if (p.t === 'a') return '선택한 학원';
  return '선택한 장소';
}

function setMapSelection(p){

function businessPoints(row){
  const all = DATA.stores && DATA.stores.points ? DATA.stores.points : {};
  const salesNote = row.sales_per_store_month
    ? '개별 가게 매출 아님 · 이 동네 ' + BIZ[state.biz].label + ' 가게 1곳의 한 달 평균 매출 ' + money(row.sales_per_store_month)
    : (row.estimated_sales_per_store_month
      ? '개별 가게 매출 아님 · 이 동네 ' + BIZ[state.biz].label + ' 1곳 추정 월평균 매출 ' + DongSalesEstimate.approxMoney(row.estimated_sales_per_store_month)
      : '');
  return CommercialMapData.pointsFor(all, row, state.biz)
    .map(p => ({...p, t: 'b', k: state.biz, sales_note: salesNote}));
}

function mapBusinessLabel(){
  return {
    cafe: '카페·커피 관련 업소',
    food: '분식·김밥·샌드위치 관련 업소',
    fitness: '필라테스·헬스 관련 업소',
    academy: '학원·교습소 관련 업소',
    unmanned: '무인·셀프 표기 업소'
  }[state.biz] || BIZ[state.biz].label + ' 관련 업소';
}

function groupBusinessPoints(points){
  const byCoord = new Map();
  for (const p of points){
    const key = [Number(p.lat).toFixed(6), Number(p.lng).toFixed(6)].join(',');
    if (!byCoord.has(key)){
      byCoord.set(key, {...p, members: [], n: p.n});
    }
    byCoord.get(key).members.push(p);
  }
  return [...byCoord.values()].map(p => {
    if (p.members.length > 1){
      p.n = '같은 위치 ' + p.members.length + '곳';
      p.c = BIZ[state.biz].label;
      p.a = p.members[0].a || '';
      p.count = p.members.length;
    }
    return p;
  });
}

function drawCommercialMap(row, keepView){
  const box = document.getElementById('map');
  if (!box) return;
  if (box.dataset.built !== '1') box.innerHTML = '<div class="mapmsg">불러오는 중...</div>';
  const linked = CommercialMapData.linkedDongs(row.code);
  (linked ? Promise.resolve(null) : loadPlaces(row)).then(data => {
    const bizRawPts = businessPoints(row);
    const bizPts = groupBusinessPoints(bizRawPts);
    if ((!data || !Array.isArray(data.items) || !data.items.length) && !bizPts.length){
      box.innerHTML = '<div class="mapmsg">이 동네에 연결된 지도 지점이 없습니다.<br>다른 행정동을 눌러보세요.</div>';
      const count = document.getElementById('mapcount');
      if (count) count.textContent = '';
      return;
    }
    return loadKakao().then(() => {
      const contextItems = data && Array.isArray(data.items) ? data.items : [];
      const context = contextItems.filter(p => p.t === 'p' || p.t === 'g' || (state.biz === 'academy' && p.t === 'a'));
      const pts = bizPts.concat(context).filter(p => state.show[mapKind(p)] !== false);
      if (!pts.length){
        clearCommercialMap();
        const count = document.getElementById('mapcount');
        if (count) count.textContent = '표시할 핀이 없습니다';
        setMapSelection(null);
        return;
      }
      const key = (data ? data.sido + '/' + data.gusi + '/' + data.dong : '') || row.gu + '/' + row.name;
      const lat = pts.reduce((s, p) => s + p.lat, 0) / pts.length;
      const lng = pts.reduce((s, p) => s + p.lng, 0) / pts.length;
      if (!commercialMap || box.dataset.built !== '1'){
        box.innerHTML = '';
        commercialMap = new kakao.maps.Map(box, {center: new kakao.maps.LatLng(lat, lng), level: 5});
        commercialMap.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
        kakao.maps.event.addListener(commercialMap, 'click', () => {
          for (const el of box.querySelectorAll('.mk.open')) el.classList.remove('open');
          setMapSelection(null);
        });
        box.dataset.built = '1';
      }
      clearCommercialMap();
      setMapSelection(null);
      const bounds = new kakao.maps.LatLngBounds();
      for (const p of pts){
        const pos = new kakao.maps.LatLng(p.lat, p.lng);
        bounds.extend(pos);
        const el = document.createElement('div');
        el.className = 'mk ' + markerClass(p);
        if (p.count > 1) el.dataset.n = p.count;
        el.tabIndex = 0;
        el.setAttribute('aria-label', p.n || '지도 지점');
        el.innerHTML = '';
        const overlay = new kakao.maps.CustomOverlay({position: pos, content: el, yAnchor: 1, clickable: true, zIndex: 2});
        overlay.setMap(commercialMap);
        commercialOverlays.push(overlay);
        el.onclick = () => {
          for (const item of box.querySelectorAll('.mk.open')) item.classList.remove('open');
          el.classList.add('open');
          setMapSelection(p);
        };
        el.onkeydown = ev => {
          if (ev.key === 'Enter' || ev.key === ' '){
            ev.preventDefault();
            el.click();
          }
        };
      }
      if (!keepView || commercialMapKey !== key) commercialMap.setBounds(bounds, 40, 40, 40, 40);
      commercialMapKey = key;
      const count = document.getElementById('mapcount');
      if (count){
        const n = t => pts.filter(p => p.t === t).length;
        const c = competitionCounts(row);
        const pointLabel = state.show.business === false
          ? mapBusinessLabel() + ' 핀 숨김'
          : '지도에 표시한 ' + mapBusinessLabel() + ' ' + fmt(bizRawPts.length) + '곳' +
            (bizRawPts.length !== n('b') ? ' (' + fmt(n('b')) + '개 위치)' : '') +
            (!linked && bizRawPts.length >= 250 ? ' · 최대 250곳 표시' : '');
        const competitionLabel = c.total
          ? '서울시 통계상 전체 ' + fmt(c.total) + '곳' +
            (c.split ? ' (일반 ' + fmt(c.stores) + ' · 프랜차이즈 ' + fmt(c.franchises) + ')' : '')
          : '서울시 통계상 점포 수 없음';
        count.textContent = [
          pointLabel,
          competitionLabel,
          !linked && state.biz === 'academy' ? '학원참고 ' + n('a') : '',
          !linked ? '아파트 ' + n('p') : '',
          !linked ? '상가 ' + n('g') : ''
        ].filter(Boolean).join(' · ');
      }
    });
  }).catch(() => {
    box.innerHTML = '<div class="mapmsg">지도를 불러오지 못했습니다.<br>카카오 지도 키 또는 네트워크 상태를 확인해주세요.</div>';
  });
}

        (hasDongSales ? stat('주의 신호', mainCaution(r), scoreGuide(r)) : '') +
        stat('매출 판단', hasDongSales ? '월평균 ' + money(r.sales_per_store_month) : (estimatedSales ? '추정 월평균 ' + DongSalesEstimate.approxMoney(estimatedSales.monthly_won) : '자료 없음'), hasDongSales ? '이 매출이 가능한 자리인지 입구 위치와 유동 방향을 현장에서 확인해야 합니다.' : (estimatedSales ? '국세청 서울 평균과 동네 다른 업종 매출을 바탕으로 한 참고값입니다.' : '매출 자료가 없으므로 점포 수와 수요 기반으로 먼저 걸러봅니다.')) +
        (visibleTasis ? stat('서울 평균 참고', manwonMoney(visibleTasis.row.avg_monthly_sales_manwon), '국세청 생활업종 기준입니다. 이 동네 매출이 아니라 서울 전체 평균입니다.') : '') +
        stat('경쟁 판단', competitionCountText(r), '가게 수보다 더 중요한 것은 후보지 반경 300m 안의 직접 경쟁입니다.') +
      '</div>' +
      (isGasStation ? '<div><p class="grp-title">차량 접근성</p>' +
        stat('차량 통행량', '자료 없음', '현재 자료에는 도로별 차량 통행량이 없습니다.') +
        stat('진입·출차', '현장 확인', '진입 방향, 유턴 가능 여부, 대기 공간을 직접 확인해야 합니다.') +
      '</div>' : '<div><p class="grp-title">생활권 해석</p>' +
        stat('주거 기반', r.apartment ? fmt(r.apartment.complexes) + '개 단지' : '자료 없음', apartmentTone(r)) +
        stat('시설 기반', r.facilities ? fmt(r.facilities.total) + '개 시설' : '자료 없음', facilityTone(r)) +
        stat('거주 가구', r.households ? fmt(r.households) + '가구' : '자료 없음', '동네 규모를 보는 자료입니다. 이 업종의 손님 수가 아닙니다.') +
      '</div>') +
      '<div><p class="grp-title">현장 검증</p>' +
        stat('첫 번째', '지도 확인', '선택 업종 핀이 어디에 몰리는지 보고, 빈 구간이 실제로 비어 있는지 확인합니다.') +
        stat('두 번째', '임대료 확인', hasDongSales || estimatedSales ? '가게 1곳 월평균 매출이 높아도 임대료·권리금이 높으면 후보에서 제외될 수 있습니다.' : '매출 자료가 없으므로 임대료·권리금과 예상 비용을 현장에서 확인해야 합니다.') +
        stat('세 번째', '시간대 확인', demandTone(r)) +
      '</div>' +
      (meta.top_markets && meta.top_markets.length ? '<div><p class="grp-title">서울 안 강한 상권</p><p class="basis-note">선택 업종 가게 1곳의 월평균 매출이 높게 잡힌 상권입니다. 후보 동네와 비교하는 참고용입니다.</p><ol class="market-rank">' + topMarketList(meta.top_markets) + '</ol></div>' : '') +
      (meta.top_hinterlands && meta.top_hinterlands.length ? '<div><p class="grp-title">주변 생활권 참고</p><p class="basis-note">상권배후지 기준으로 같은 업종이 강하게 잡힌 곳입니다.</p><ol class="market-rank">' + topMarketList(meta.top_hinterlands) + '</ol></div>' : '') +
    '</div>';
  const linkedMapDongs = CommercialMapData.linkedDongs(r.code);
  const mapScopeNote = linkedMapDongs
    ? '<p class="basis-note">매출·가게 수는 원자료의 ' + escapeHtml(r.name) + ' 기준입니다. 지도 업소 위치는 현재 ' + escapeHtml(linkedMapDongs.join('·')) + ' 기준이며, 범위가 다른 주변 장소는 표시하지 않습니다.</p>'
    : '';
  const mapTab = mapScopeNote +
    '<div class="maparea"><div id="map"></div>' +
      '<div class="maplegend commercial-map-legend">' +
        mapToggle('business', mapBusinessLabel(), 'b1') +
        (!linkedMapDongs && state.biz === 'academy' ? mapToggle('academy', '기존 학원 참고', 'a1') : '') +
        (linkedMapDongs ? '' : mapToggle('apartment', '아파트', 'p3') + mapToggle('shop', '상가', 'g3')) +
        '<span class="hint" id="mapcount"></span>' +
      '</div>' +
      '<aside class="map-selection" id="mapSelection"><span>선택한 장소</span><p>지도 지점을 선택하면 상호명과 주소가 나옵니다.</p></aside>' +
    '</div>';
  const checksTab = nextChecks(r, {hasDongSales, estimatedSales, visibleTasis, salesIncomplete: r.sales_incomplete});
  const content = {summary: summaryTab, sales: salesTab, demand: demandTab, analysis: analysisTab, map: mapTab, checks: checksTab}[state.tab] || summaryTab;
  const leadText = r.sales_per_store_month
    ? '가게 1곳 월평균 매출 <b>' + money(r.sales_per_store_month) + '</b>'
    : (estimatedSales
      ? '1곳 추정 월평균 매출 <b>' + DongSalesEstimate.approxMoney(estimatedSales.monthly_won) + '</b>'
      : '이 동네 매출 자료 <b>없음</b>');
  const showLead = !['summary', 'sales', 'analysis'].includes(state.tab);
  detailTabs.innerHTML = TABS.map(t => '<button type="button" aria-pressed="' + (state.tab === t.k) + '" data-tab="' + t.k + '">' + t.l + '</button>').join('');
  for (const el of detailTabs.querySelectorAll('button')){
    el.onclick = () => { state.tab = el.dataset.tab; render(); };
  }
  detail.innerHTML =
    '<div class="dhead"><h3>' + r.name + '</h3><span class="p">' + r.gu + ' · 행정동 · ' + BIZ[state.biz].label + ' 기준</span>' + (showLead ? '<span class="lead">' + leadText + '</span>' : '') + '</div>' +
    '<div class="dbody">' + content + '</div>';
  if (state.tab === 'map'){
    for (const el of detail.querySelectorAll('.tg[data-show]')){
      el.onclick = () => {
        state.show[el.dataset.show] = !state.show[el.dataset.show];
        el.setAttribute('aria-pressed', String(state.show[el.dataset.show]));
        drawCommercialMap(r, true);
      };
    }
    drawCommercialMap(r);
  }
}

function render(){
  syncSegments();
  biz.value = state.biz;
  dongPick.value = state.dong || '';
  q.value = state.q;
  const rows = filteredRows();
  const currentSort = SORTS.find(it => it.k === state.sort) || SORTS[0];
  sortHelp.textContent = !hasComparableSalesData() && currentSort.k === 'stores'
    ? salesMissingText() + ' 지금은 점포 수 기준으로 보여줍니다.'
    : !hasSalesData() && hasEstimatedSalesData() && currentSort.k === 'sales_per_store_month'
      ? '국세청 서울 평균을 동네의 다른 업종 매출 수준으로 조정한 추정치 순입니다.'
    : currentSort.help;
  const totalPages = Math.max(1, Math.ceil(rows.length / state.pageSize));
  if (state.page > totalPages) state.page = totalPages;
  if (state.page < 1) state.page = 1;
  const pageStart = (state.page - 1) * state.pageSize;
  const list = rows.slice(pageStart, pageStart + state.pageSize);
  if (!state.picked && list[0]) state.picked = list[0].code;
  renderSummary(rows);
  dataAlert();
  const salesColumnTitle = !hasSalesData() && hasEstimatedSalesData() ? '1곳 추정 월평균 매출' : '가게 1곳 월평균 매출';
  const pager = rows.length > state.pageSize
    ? '<div class="commercial-pager">' +
        '<button type="button" data-page="prev" ' + (state.page <= 1 ? 'disabled' : '') + '>이전</button>' +
        '<span>' + fmt(pageStart + 1) + '-' + fmt(Math.min(pageStart + state.pageSize, rows.length)) + ' / ' + fmt(rows.length) + '</span>' +
        '<button type="button" data-page="next" ' + (state.page >= totalPages ? 'disabled' : '') + '>다음</button>' +
      '</div>'
    : '';
  const sortDirControl = '<div class="commercial-sortdir" role="group" aria-label="정렬 방향">' +
    '<button type="button" data-sort-dir="desc" aria-pressed="' + (state.sortDir === 'desc') + '">높은순</button>' +
    '<button type="button" data-sort-dir="asc" aria-pressed="' + (state.sortDir === 'asc') + '">낮은순</button>' +
  '</div>';
  document.querySelectorAll('.commercial-sortdir').forEach(el => el.remove());
  const showScore = hasSalesData();
  table.innerHTML = '<div class="commercial-head' + (showScore ? '' : ' no-score') + '"><span></span><span>동네</span><span>' + salesColumnTitle + '</span><span>같은 업종 가게 수</span><span>인구 구성</span>' + (showScore ? '<span>매출·인구·소비·경쟁 지표</span>' : '') + '</div>' +
    (list.length ? list.map((row, idx) => rowHtml(row, pageStart + idx + 1)).join('') : '<div class="none">조건에 맞는 행정동이 없습니다.</div>') +
    pager;
  table.insertAdjacentHTML('beforebegin', sortDirControl);
  for (const el of table.querySelectorAll('.commercial-row')){
    el.onclick = () => { state.picked = el.dataset.code; render(); };
  }
  for (const el of table.querySelectorAll('[data-page]')){
    el.onclick = () => {
      state.page += el.dataset.page === 'next' ? 1 : -1;
      state.picked = '';
      render();
    };
  }
  for (const el of document.querySelectorAll('.commercial-sortdir [data-sort-dir]')){
    el.onclick = () => {
      state.sortDir = el.dataset.sortDir;
      state.page = 1;
      state.picked = '';
      render();
    };
  }
  renderDetail(rows);
}

sortPick.innerHTML = SORTS.map(it => '<option value="' + it.k + '">' + it.l + '</option>').join('');
sortPick.onchange = e => { state.sort = e.target.value; state.picked = ''; state.page = 1; render(); };
dongPick.onchange = e => { state.dong = e.target.value; state.q = ''; state.picked = e.target.value; state.page = 1; render(); };
biz.onchange = e => {
  state.biz = e.target.value;
  state.picked = '';
  state.page = 1;
  buildRows();
  if (!hasComparableSalesData() && state.sort === 'sales_per_store_month') state.sort = 'stores';
  render();
};
q.oninput = e => { state.q = e.target.value; state.picked = ''; state.page = 1; render(); };

Promise.all(Object.entries(FILES).map(([key, file]) =>
  loadJson(file).then(v => { DATA[key] = v; }).catch(() => {})
)).then(() => {
  if (!DATA.view){
    alert.hidden = false;
    alert.innerHTML = '<b>상권 화면용 데이터가 없습니다.</b><br>먼저 <code>web/data/commercial-view-dong.json</code>을 생성해야 합니다.';
    return;
  }
  applyBusinessTypes();
  applyDongOptions();
  dongSalesEstimator = DongSalesEstimate.create(DATA.view);
  buildRows();
  render();
});
</script>
<script src="dates.js?v=75"></script>
</body>
</html>
