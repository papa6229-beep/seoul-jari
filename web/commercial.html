<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>상권 데이터 — 서울자리</title>
<link rel="stylesheet" href="styles.css?v=59">
<script>
(function(){
  var PAGE_V = '59';
  fetch('version.json?t=' + Date.now(), {cache: 'no-store'})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){
      if (!d || d.v === PAGE_V) return;
      var key = 'reloaded-' + d.v;
      try { if (sessionStorage.getItem(key)) return; sessionStorage.setItem(key, '1'); } catch (e) { return; }
      location.reload();
    })
    .catch(function(){});
})();
</script>
</head>
<body>
<div class="app commercial-app">
  <aside class="side">
    <a class="home-link" href="index.html">← 메뉴</a>
    <h1>상권 데이터</h1>
    <p class="where">행정동 기준 · 상권분석서비스 자동갱신 데이터</p>

    <div class="field">
      <label for="biz">업종</label>
      <select class="pick" id="biz">
        <option value="cafe">개인 카페</option>
        <option value="food">분식 · 김밥 · 식사</option>
        <option value="fitness">필라테스 · PT</option>
        <option value="academy">학원 · 교습소</option>
        <option value="unmanned">무인점포</option>
      </select>
    </div>

    <div class="field">
      <label for="q">행정동 검색</label>
      <input class="search" id="q" type="search" placeholder="예: 성수, 잠실7동, 강남구">
      <small class="qhint">행정동 자료라 기존 입지 분석의 법정동 화면과 따로 봅니다.</small>
    </div>

    <div class="field">
      <span class="lbl">정렬</span>
      <div class="seg" id="sort"></div>
    </div>

    <div class="field">
      <span class="lbl">표시</span>
      <div class="seg" id="limit"></div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h2 id="title">행정동 상권 신호</h2>
      <span class="basis" id="basis">공공데이터 기반 참고 정보</span>
      <details class="dates" data-dates><summary>자료 기준일</summary></details>
    </div>

    <div class="commercial-summary" id="summary"></div>
    <div class="commercial-alert" id="alert" hidden></div>
    <section class="commercial-insight" id="insight"></section>
    <section class="commercial-table" id="table"></section>
    <section class="detail commercial-detail" id="detail"></section>

    <p class="note">이 화면은 후보지를 좁히는 참고용입니다. 임대차 계약, 창업, 투자 판단은 현장 조사와 전문가 검토가 필요합니다.</p>
  </main>
</div>

<script>
const V = '59';
const FILES = {
  view: 'commercial-view-dong.json'
};
const BIZ = {
  cafe: {
    label: '개인 카페',
    words: ['커피', '음료', '제과', '패스트푸드'],
    demand: ['유동인구', '20~40대 상주·직장인', '식료품·음식 소비'],
    caution: '카페는 임대료와 체류 동선 영향이 큽니다. 매출이 높아도 경쟁 점포 수를 같이 봅니다.'
  },
  food: {
    label: '분식 · 김밥 · 식사',
    words: ['한식', '분식', '김밥', '패스트푸드', '중식', '일식', '양식'],
    demand: ['점심 유동', '직장인구', '음식 소비'],
    caution: '점심형 업종은 11~14시 신호와 직장인구가 중요합니다. 배달 플랫폼 노출은 별도 확인이 필요합니다.'
  },
  fitness: {
    label: '필라테스 · PT',
    words: ['스포츠', '운동', '헬스', '체육'],
    demand: ['20~40대 상주·직장인', '저녁 유동', '여가·문화 소비'],
    caution: '건물 조건, 샤워실, 층고, 방음, 주차는 공공데이터로 판단할 수 없습니다.'
  },
  academy: {
    label: '학원 · 교습소',
    words: ['학원', '교습', '교육', '예술학원', '외국어'],
    demand: ['10대 상주인구', '교육 소비', '기존 교육업 점포'],
    caution: '행정동 상권자료와 학원 인허가 자료는 기준이 다릅니다. 최종 판단은 기존 입지 분석 화면과 함께 봅니다.'
  },
  unmanned: {
    label: '무인점포',
    words: ['편의점', '슈퍼', '문구', '세탁', '생활용품'],
    demand: ['상주인구', '야간·저녁 유동', '가구 수'],
    caution: '무인 운영 리스크, 민원, 치안, 관리 거리는 현장 확인이 필요합니다.'
  }
};

const state = {biz: new URLSearchParams(location.search).get('biz') || 'cafe', q: '', sort: 'score', limit: 30, picked: ''};
const DATA = {};
let ROWS = [];

const fmt = n => n === null || n === undefined ? '—' : n.toLocaleString('ko-KR');
const pct = n => n === null || n === undefined ? '—' : Math.round(n) + '%';
const money = n => {
  if (!n) return '—';
  if (n >= 100000000) return (n / 100000000).toFixed(1).replace(/\.0$/, '') + '억';
  return Math.round(n / 10000).toLocaleString('ko-KR') + '만원';
};

function segment(host, items, get, set){
  host.innerHTML = '';
  items.forEach(it => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = it.l;
    b.setAttribute('aria-pressed', String(get() === it.k));
    b.onclick = () => { set(it.k); render(); };
    host.appendChild(b);
  });
}

async function loadJson(name){
  const res = await fetch('data/' + name + '?v=' + V, {cache:'no-store'});
  if (!res.ok) throw new Error(name);
  return res.json();
}

function latestRows(payload){
  return payload && Array.isArray(payload.rows) ? payload.rows : [];
}

function norm(v, min, max, inverse){
  if (v === null || v === undefined || !Number.isFinite(v)) return 0;
  if (max <= min) return 50;
  const p = Math.max(0, Math.min(100, ((v - min) / (max - min)) * 100));
  return inverse ? 100 - p : p;
}

function level(value, rows, key, high, mid, low){
  const vals = rows.map(r => r[key]).filter(v => Number.isFinite(v));
  if (!Number.isFinite(value) || vals.length < 3) return low;
  vals.sort((a, b) => a - b);
  const top = vals[Math.floor(vals.length * .75)];
  const middle = vals[Math.floor(vals.length * .45)];
  if (value >= top) return high;
  if (value >= middle) return mid;
  return low;
}

function median(rows, key){
  const vals = rows.map(r => r[key]).filter(v => Number.isFinite(v)).sort((a, b) => a - b);
  if (!vals.length) return 0;
  return vals[Math.floor(vals.length / 2)];
}

function buildRows(){
  const base = latestRows(DATA.view).map(src => {
    const biz = (src.biz && src.biz[state.biz]) || {};
    const demand = (src.floating || 0) + (src.workers || 0) * 800 + (src.residents || 0) * 250;
    const unitPrice = biz.sales && biz.sales_count ? Math.round(biz.sales / biz.sales_count) : null;
    return {
      code: src.code, gu: src.gu, name: src.name, full_name: src.full_name,
      floating: src.floating || null,
      lunch_flow: src.lunch_flow || null,
      evening_flow: src.evening_flow || null,
      workers: src.workers || null,
      residents: src.residents || null,
      households: src.households || null,
      core_people: src.core_people || null,
      spending: src.spending || null,
      food_spending: src.food_spending || null,
      education_spending: src.education_spending || null,
      leisure_spending: src.leisure_spending || null,
      sales: biz.sales || null,
      sales_count: biz.sales_count || null,
      unit_price: unitPrice,
      stores: biz.stores || null,
      franchises: biz.franchises || null,
      open: biz.open || null,
      close: biz.close || null,
      demand_raw: demand,
      sales_items: biz.sales_items || [],
      store_items: biz.store_items || []
    };
  });

  const ranges = {};
  ['demand_raw','sales','stores','spending','core_people','workers','residents'].forEach(k => {
    const vals = base.map(r => r[k]).filter(v => Number.isFinite(v));
    ranges[k] = {min: Math.min(...vals), max: Math.max(...vals)};
  });
  base.forEach(r => {
    const demand = norm(r.demand_raw, ranges.demand_raw.min, ranges.demand_raw.max);
    const revenue = norm(r.sales || 0, ranges.sales.min, ranges.sales.max);
    const spending = norm(r.spending || 0, ranges.spending.min, ranges.spending.max);
    const competition = norm(r.stores || 0, ranges.stores.min, ranges.stores.max, true);
    r.competition_score = Math.round(competition);
    r.score = Math.round(demand * .32 + revenue * .28 + spending * .18 + competition * .22);
  });
  ROWS = base;
}

function dataAlert(){
  const missing = Object.entries(FILES)
    .filter(([k]) => !DATA[k] || !latestRows(DATA[k]).length)
    .map(([k, f]) => f);
  if (!missing.length){ alert.hidden = true; return; }
  alert.hidden = false;
  alert.innerHTML = '<b>아직 생성되지 않은 화면용 자동갱신 파일이 있습니다.</b><br>' +
    'GitHub Actions의 <b>Update Living Population</b>을 실행하면 채워집니다. 현재 화면은 이미 있는 데이터만으로 보여줍니다.<br>' +
    '<small>' + missing.join(' · ') + '</small>';
}

function renderSummary(rows){
  const b = BIZ[state.biz];
  const loaded = Object.keys(DATA).filter(k => DATA[k]).length;
  const quarter = DATA.view && DATA.view.quarter ? DATA.view.quarter : '-';
  summary.innerHTML =
    '<div><span>선택 업종 기준</span><b>' + b.label + '</b><p>매출, 점포, 개·폐업은 이 업종 묶음만 합산합니다.</p></div>' +
    '<div><span>지역 수요 기준</span><b>' + b.demand.join(' · ') + '</b><p>유동인구, 직장인구, 상주인구, 소비지출은 행정동 전체 신호입니다.</p></div>' +
    '<div><span>자료</span><b>' + loaded + '/1개 연결</b><p>행정동 ' + fmt(rows.length) + '곳 · ' + quarter + '분기 기준</p></div>';
}

function insightCard(kind, label, row, body){
  if (!row) return '';
  return '<button type="button" class="insight-card ' + kind + '" data-code="' + row.code + '">' +
    '<span>' + label + '</span>' +
    '<b>' + row.gu + ' ' + row.name + '</b>' +
    '<p>' + body + '</p>' +
    '<small>종합 ' + fmt(row.score) + ' · 매출 ' + money(row.sales) + ' · 점포 ' + fmt(row.stores) + '곳</small>' +
  '</button>';
}

function renderInsight(rows){
  const b = BIZ[state.biz];
  const top = rows[0];
  const salesMid = median(rows, 'sales');
  const workerMid = median(rows, 'workers');
  const niche = rows
    .filter(r => (r.sales || 0) >= salesMid && (r.workers || 0) >= workerMid)
    .slice()
    .sort((a, b) => (b.competition_score || 0) - (a.competition_score || 0) || (b.score || 0) - (a.score || 0))[0];
  const crowded = rows
    .filter(r => r.stores && r.sales)
    .slice()
    .sort((a, b) => (b.stores || 0) - (a.stores || 0))[0];
  insight.innerHTML =
    '<div class="insight-title"><b>' + b.label + ' 후보 요약</b><span>순위는 선택 업종 기준, 수요는 행정동 전체 기준입니다.</span></div>' +
    '<div class="insight-grid">' +
      insightCard('best', '추천 1순위', top, '매출과 지역 수요를 함께 봤을 때 가장 앞에 있는 후보입니다.') +
      insightCard('niche', '틈새 후보', niche, '매출과 직장 수요는 살아 있으면서 선택 업종 점포 부담이 상대적으로 낮은 후보입니다.') +
      insightCard('risk', '경쟁 확인', crowded, '선택 업종 점포가 많아 임대료와 차별화 조건을 먼저 봐야 하는 후보입니다.') +
    '</div>';
  for (const el of insight.querySelectorAll('.insight-card')){
    el.onclick = () => { state.picked = el.dataset.code; render(); };
  }
}

function filteredRows(){
  const q = state.q.trim();
  let out = ROWS;
  if (q) out = out.filter(r => (r.full_name + ' ' + r.gu + ' ' + r.name).includes(q));
  out = out.filter(r => r.score || r.sales || r.stores || r.floating || r.workers || r.residents);
  const key = state.sort;
  out = out.slice().sort((a, b) => (b[key] || 0) - (a[key] || 0) || a.code.localeCompare(b.code));
  return out;
}

function rowHtml(r, i){
  const active = state.picked === r.code ? ' active' : '';
  const storeLabel = r.stores ? '점포 ' + fmt(r.stores) + '곳' : '점포 자료 없음';
  return '<button type="button" class="commercial-row' + active + '" data-code="' + r.code + '">' +
    '<span class="rank">' + (i + 1) + '</span>' +
    '<span class="place"><b>' + r.gu + ' ' + r.name + '</b><small>' + r.code + ' · ' + storeLabel + '</small></span>' +
    '<span><b>' + fmt(r.score) + '</b><small>종합</small></span>' +
    '<span><b>' + money(r.sales) + '</b><small>선택업종 매출</small></span>' +
    '<span><b>' + fmt(r.stores) + '</b><small>선택업종 점포</small></span>' +
    '<span><b>' + fmt(r.workers) + '</b><small>직장인구</small></span>' +
    '<span><b>' + fmt(r.residents) + '</b><small>상주인구</small></span>' +
  '</button>';
}

function explainRow(r, rows){
  const b = BIZ[state.biz];
  const bits = [
    level(r.sales, rows, 'sales', '선택 업종 매출이 서울 상위권입니다', '선택 업종 매출이 중상위권입니다', '선택 업종 매출 신호는 약합니다'),
    level(r.workers, rows, 'workers', '직장인구가 많아 평일 수요가 강합니다', '직장인구가 일정 수준 있습니다', '직장인구 신호는 약합니다'),
    level(r.residents, rows, 'residents', '상주인구 기반 수요도 큽니다', '상주인구 기반 수요가 보통입니다', '상주인구 기반 수요는 제한적입니다')
  ];
  const caution = r.stores
    ? b.label + ' 관련 점포가 ' + fmt(r.stores) + '곳이라 경쟁 강도는 별도 확인이 필요합니다.'
    : b.label + ' 관련 점포 수가 낮게 잡혀 현장 확인이 필요합니다.';
  return '<div class="commercial-why"><b>왜 이 순위인가</b><p>' + bits.join(' · ') + '.</p><p class="warn">' + caution + '</p></div>';
}

function nextChecks(r){
  const checks = [
    '역 출구, 횡단보도, 버스정류장 기준 실제 보행 동선을 확인',
    '1층 가시성, 전면 폭, 권리금, 월세를 같은 기준으로 비교',
    '네이버지도와 현장 방문으로 동일 업종 체감 밀도를 확인'
  ];
  if ((r.stores || 0) > 100) checks.unshift('선택 업종 점포가 많으므로 가격, 콘셉트, 회전율 차별화 가능성을 먼저 확인');
  if ((r.workers || 0) > (r.residents || 0) * 2) checks.unshift('평일 점심·퇴근 수요형인지, 주말 공백을 버틸 수 있는지 확인');
  if ((r.residents || 0) > (r.workers || 0) * 2) checks.unshift('주거 수요형인지, 야간·주말 운영 시간과 객단가가 맞는지 확인');
  return '<div class="commercial-checks"><p class="grp-title">다음 확인사항</p><ul>' + checks.slice(0, 5).map(v => '<li>' + v + '</li>').join('') + '</ul></div>';
}

function renderDetail(rows){
  const r = rows.find(x => x.code === state.picked) || rows[0];
  if (!r){
    detail.innerHTML = '<div class="dempty">표에서 행정동을 선택하면 상권 신호를 볼 수 있습니다.</div>';
    return;
  }
  state.picked = r.code;
  const topSales = r.sales_items.slice().sort((a, b) => (b.amount || 0) - (a.amount || 0)).slice(0, 5);
  const topStores = r.store_items.slice().sort((a, b) => (b.store_count || 0) - (a.store_count || 0)).slice(0, 5);
  const stat = (k, v, s) => '<div class="stat"><span class="k">' + k + '</span><span class="v">' + v + '</span>' + (s ? '<span class="sub-note">' + s + '</span>' : '') + '</div>';
  const item = r => '<li><b>' + r.business_name + '</b><span>' + (r.amount ? money(r.amount) : fmt(r.store_count) + '곳') + '</span></li>';
  detail.innerHTML =
    '<div class="dhead"><h3>' + r.name + '</h3><span class="p">' + r.gu + ' · 행정동 · ' + BIZ[state.biz].label + ' 기준</span><span class="lead">종합 <b>' + fmt(r.score) + '</b>점</span></div>' +
    explainRow(r, rows) +
    '<div class="dbody">' +
      '<div class="groups">' +
        '<div><p class="grp-title">수요</p>' +
          stat('유동인구', fmt(r.floating)) +
          stat('점심 유동', fmt(r.lunch_flow)) +
          stat('저녁 유동', fmt(r.evening_flow)) +
          stat('직장인구', fmt(r.workers)) +
          stat('상주인구', fmt(r.residents)) +
        '</div>' +
        '<div><p class="grp-title">선택 업종 매출</p>' +
          stat(BIZ[state.biz].label + ' 추정매출', money(r.sales), r.sales_count ? '매출건수 ' + fmt(r.sales_count) + '건' : '') +
          stat('선택 업종 객단가', r.unit_price ? fmt(r.unit_price) + '원' : '—') +
          stat('총 소비지출', money(r.spending)) +
          stat('음식 소비', money(r.food_spending)) +
          stat('교육 소비', money(r.education_spending)) +
        '</div>' +
        '<div><p class="grp-title">선택 업종 경쟁</p>' +
          stat(BIZ[state.biz].label + ' 점포', fmt(r.stores)) +
          stat('프랜차이즈', fmt(r.franchises)) +
          stat('개업 점포', fmt(r.open)) +
          stat('폐업 점포', fmt(r.close)) +
          stat('가구 수', fmt(r.households)) +
        '</div>' +
      '</div>' +
      '<div class="commercial-lists">' +
        '<div><p class="grp-title">선택 업종 매출 구성</p><ol>' + (topSales.length ? topSales.map(item).join('') : '<li>자료 없음</li>') + '</ol></div>' +
        '<div><p class="grp-title">선택 업종 점포 구성</p><ol>' + (topStores.length ? topStores.map(item).join('') : '<li>자료 없음</li>') + '</ol></div>' +
      '</div>' +
      nextChecks(r) +
    '</div>';
}

function render(){
  biz.value = state.biz;
  q.value = state.q;
  const rows = filteredRows();
  basis.textContent = '상권분석서비스 행정동 기준 · ' + BIZ[state.biz].label;
  renderSummary(rows);
  dataAlert();
  renderInsight(rows);
  const list = rows.slice(0, state.limit);
  table.innerHTML = '<div class="commercial-head"><span></span><span>행정동</span><span>종합</span><span>선택업종 매출</span><span>선택업종 점포</span><span>직장</span><span>상주</span></div>' +
    (list.length ? list.map(rowHtml).join('') : '<div class="none">조건에 맞는 행정동이 없습니다.</div>');
  for (const el of table.querySelectorAll('.commercial-row')){
    el.onclick = () => { state.picked = el.dataset.code; render(); };
  }
  renderDetail(rows);
}

segment(sort, [
  {k:'score', l:'종합'}, {k:'sales', l:'매출'}, {k:'competition_score', l:'틈새'}, {k:'workers', l:'직장'}, {k:'residents', l:'상주'}
], () => state.sort, k => state.sort = k);
segment(limit, [
  {k:20, l:'20'}, {k:30, l:'30'}, {k:50, l:'50'}
], () => state.limit, k => state.limit = k);
biz.onchange = e => { state.biz = e.target.value; state.picked = ''; render(); };
q.oninput = e => { state.q = e.target.value; state.picked = ''; render(); };

Promise.all(Object.entries(FILES).map(([key, file]) =>
  loadJson(file).then(v => { DATA[key] = v; }).catch(() => {})
)).then(() => {
  if (!DATA.view){
    alert.hidden = false;
    alert.innerHTML = '<b>상권 화면용 데이터가 없습니다.</b><br>먼저 <code>web/data/commercial-view-dong.json</code>을 생성해야 합니다.';
    return;
  }
  buildRows();
  render();
});
</script>
