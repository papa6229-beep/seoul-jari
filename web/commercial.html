<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>상권 데이터 — 서울자리</title>
<link rel="stylesheet" href="styles.css?v=91">
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=0d6d1f6f1bf11cb9d1c630cf365f8a2c&autoload=false"></script>
<script>
(function(){
  var PAGE_V = '91';
  fetch('version.json?t=' + Date.now(), {cache: 'no-store'})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){
      if (!d || d.v === PAGE_V) return;
      var key = 'reloaded-' + d.v;
      try { if (sessionStorage.getItem(key)) return; sessionStorage.setItem(key, '1'); } catch (e) { return; }
      location.reload();
    })
    .catch(function(){});
})();
</script>
</head>
<body>
<div class="app commercial-app">
  <aside class="side">
    <a class="home-link" href="index.html">← 메뉴</a>
    <h1>상권 데이터</h1>
    <p class="where">행정동 기준 · 상권분석서비스 자동갱신 데이터</p>

    <div class="field">
      <label for="biz">업종</label>
      <select class="pick" id="biz">
        <option value="cafe">개인 카페</option>
      </select>
    </div>

    <div class="field">
      <label for="dongPick">행정동 선택</label>
      <select class="pick" id="dongPick">
        <option value="">전체 행정동</option>
      </select>
    </div>

    <div class="field">
      <label for="q">행정동 검색</label>
      <input class="search" id="q" type="search" placeholder="예: 성수, 잠실7동, 강남구">
    </div>

    <div class="field">
      <label for="sortPick">정렬</label>
      <select class="pick" id="sortPick"></select>
      <small class="qhint" id="sortHelp"></small>
    </div>

    <p class="side-note">상위 10개 후보만 표시합니다. 행을 누르면 상세 기준이 바뀝니다.</p>
  </aside>

  <main class="main">
    <div class="topbar">
      <details class="dates" data-dates><summary>자료 기준일</summary></details>
    </div>

    <div class="commercial-summary compact" id="summary"></div>
    <div class="commercial-alert" id="alert" hidden></div>
    <section class="commercial-table" id="table"></section>
    <nav class="detail-tabs" id="detailTabs"></nav>
    <section class="detail commercial-detail" id="detail"></section>

    <p class="note">이 화면은 후보지를 좁히는 참고용입니다. 임대차 계약, 창업, 투자 판단은 현장 조사와 전문가 검토가 필요합니다.</p>
  </main>
</div>

<script>
const V = '91';
const FILES = {
  view: 'commercial-view-dong.json',
  places: 'places/index.json',
  stores: 'store-summary.json',
  coverage: 'commercial-coverage.json'
};
const BIZ = {
  cafe: {
    label: '개인 카페',
    words: ['커피', '음료', '제과', '패스트푸드'],
    demand: ['유동인구', '20~40대 상주·직장인', '식료품·음식 소비'],
    caution: '카페는 임대료와 체류 동선 영향이 큽니다. 매출이 높아도 경쟁 점포 수를 같이 봅니다.'
  },
  food: {
    label: '분식 · 김밥 · 식사',
    words: ['한식', '분식', '김밥', '패스트푸드', '중식', '일식', '양식'],
    demand: ['점심 유동', '직장인구', '음식 소비'],
    caution: '점심형 업종은 11~14시 신호와 직장인구가 중요합니다. 배달 플랫폼 노출은 별도 확인이 필요합니다.'
  },
  fitness: {
    label: '필라테스 · PT',
    words: ['스포츠 강습', '스포츠클럽', '헬스', '체육'],
    demand: ['20~40대 상주·직장인', '저녁 유동', '여가·문화 소비'],
    caution: '건물 조건, 샤워실, 층고, 방음, 주차는 공공데이터로 판단할 수 없습니다.'
  },
  academy: {
    label: '학원 · 교습소',
    words: ['학원', '교습', '교육', '예술학원', '외국어'],
    demand: ['10대 상주인구', '교육 소비', '기존 교육업 점포'],
    caution: '행정동 상권자료와 학원 인허가 자료는 기준이 다릅니다. 최종 판단은 기존 입지 분석 화면과 함께 봅니다.'
  },
  unmanned: {
    label: '무인점포',
    words: ['편의점', '슈퍼', '문구', '세탁', '생활용품'],
    demand: ['상주인구', '야간·저녁 유동', '가구 수'],
    caution: '무인 운영 리스크, 민원, 치안, 관리 거리는 현장 확인이 필요합니다.'
  }
};

const state = {
  biz: new URLSearchParams(location.search).get('biz') || 'cafe',
  dong: '', q: '', sort: 'sales_per_store_month', picked: '', tab: 'summary',
  show: {business: true, school: false, academy: false, apartment: true, shop: true}
};
const DATA = {};
let ROWS = [];
const SORTS = [
  {k:'sales_per_store_month', l:'가게당 월매출', help:'이 동네에서 같은 업종 가게 1곳이 한 달에 얼마나 파는지 보는 값입니다.'},
  {k:'stores', l:'같은 업종 가게 수', help:'같은 업종 가게가 많은 동네부터 봅니다. 손님도 많을 수 있지만 경쟁도 셉니다.'},
  {k:'competition_score', l:'경쟁 덜한 곳', help:'같은 업종 가게가 비교적 적은 동네부터 봅니다. 매출도 같이 확인해야 합니다.'},
  {k:'workers', l:'직장인구', help:'평일 낮에 이 동네에서 일하는 사람이 많은 순서입니다.'},
  {k:'residents', l:'거주인구', help:'이 동네에 사는 사람이 많은 순서입니다.'}
];
const TABS = [
  {k:'summary', l:'요약'},
  {k:'sales', l:'돈·경쟁'},
  {k:'demand', l:'수요'},
  {k:'analysis', l:'분석'},
  {k:'map', l:'지도'},
  {k:'checks', l:'확인사항'}
];

function escapeHtml(v){
  return String(v || '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

const fmt = n => n === null || n === undefined ? '—' : n.toLocaleString('ko-KR');
const count = (n, unit) => (n === null || n === undefined ? 0 : n).toLocaleString('ko-KR') + unit;
const withUnit = (n, unit) => n === null || n === undefined ? '자료 없음' : fmt(n) + unit;
const pct = n => n === null || n === undefined ? '—' : Math.round(n) + '%';
const money = n => {
  if (!n) return '—';
  if (n >= 100000000) return (n / 100000000).toFixed(1).replace(/\.0$/, '') + '억';
  return Math.round(n / 10000).toLocaleString('ko-KR') + '만원';
};
const shortMoney = n => {
  if (!n) return '—';
  if (n >= 100000000) return (n / 100000000).toFixed(1).replace(/\.0$/, '') + '억';
  return Math.round(n / 10000).toLocaleString('ko-KR') + '만';
};
const quarterLabel = q => {
  const v = String(q || '');
  return /^\d{5}$/.test(v) ? v.slice(0, 4) + '년 ' + v.slice(4) + '분기' : '최신 분기';
};

function syncSegments(){
  if (!hasSalesData() && state.sort === 'sales_per_store_month') state.sort = 'stores';
  sortPick.value = state.sort;
}

function serviceCaution(label){
  return label + ' 세부 업종 기준으로 매출·점포·수요를 봅니다. 매출이 없는 업종은 점포 밀도와 지도 핀을 먼저 봅니다.';
}

function coverageFor(id = state.biz){
  const items = DATA.coverage && Array.isArray(DATA.coverage.items) ? DATA.coverage.items : [];
  return items.find(item => item.id === id) || null;
}

function hasSalesData(){
  const c = coverageFor();
  return c ? !!c.has_sales : ROWS.some(r => r.sales);
}

function hasMapData(){
  const c = coverageFor();
  return c ? !!c.has_map_points : false;
}

function salesMissingText(){
  const picked = ROWS.find(r => r.code === state.picked);
  const ref = (picked && picked.reference_sales) || (BIZ[state.biz] && BIZ[state.biz].reference_sales);
  if (ref && ref.monthly_sales_per_store){
    return '행정동 매출은 없지만 ' + ref.scope + ' 기준 가게 1곳의 한 달 참고 매출은 ' + money(ref.monthly_sales_per_store) + '입니다. 후보 비교는 가게 수·수요·지도 중심으로 봅니다.';
  }
  return '이 업종은 행정동 추정매출이 제공되지 않아 가게 수·수요·지도 중심으로 봅니다.';
}

function referenceText(ref){
  if (!ref || !ref.monthly_sales_per_store) return '';
  return ref.scope + ' 기준 가게 1곳의 한 달 참고 매출 ' + money(ref.monthly_sales_per_store) +
    (ref.customer_unit_price ? ', 손님 1명이 보통 쓰는 돈 ' + fmt(ref.customer_unit_price) + '원' : '');
}

function businessMeta(){
  return (DATA.view && Array.isArray(DATA.view.business_types) ? DATA.view.business_types : [])
    .find(item => item.id === state.biz) || {};
}

function topMarketList(items){
  if (!items || !items.length) return '<li>참고 상권 자료 없음</li>';
  return items.slice(0, 5).map(item =>
    '<li><b>' + escapeHtml(item.area_name || '이름 없음') + '</b><span>' +
    shortMoney(item.monthly_sales_per_store) + '/월</span><small>' +
    escapeHtml([item.market_type_name, count(item.stores, '곳'), item.customer_unit_price ? '손님 1명이 보통 쓰는 돈 ' + fmt(item.customer_unit_price) + '원' : ''].filter(Boolean).join(' · ')) +
    '</small></li>'
  ).join('');
}

function coverageLabel(cov){
  if (!cov) return '자료 상태 확인 중';
  if (!cov.has_sales && cov.has_reference_sales) return '행정동 매출 없음 · 참고 매출 있음';
  return cov.coverage_label || [
    cov.has_sales ? '매출 있음' : '매출 없음',
    cov.has_stores ? '점포 있음' : '점포 없음',
    cov.has_map_points ? '지도 있음' : '지도 없음'
  ].join(' · ');
}

function coverageAction(cov){
  if (!cov) return '업종별 자료 상태를 불러오는 중입니다.';
  if (!cov.has_sales && cov.has_reference_sales) return '행정동 후보 순위에는 쓰지 않고, 업종 규모를 설명하는 참고값으로만 보여줍니다.';
  return cov.recommended_action || (cov.has_sales
    ? '매출과 점포 데이터를 같이 볼 수 있습니다.'
    : '공공 매출은 미제공입니다. 점포·수요·지도 중심으로 먼저 봅니다.');
}

function coverageClass(cov){
  const level = cov && cov.coverage_level ? cov.coverage_level : 'limited';
  return 'coverage-' + level;
}

function renderCoverageBox(){
  if (typeof coverageBox === 'undefined' || !coverageBox) return;
  const cov = coverageFor();
  const parts = cov ? [
    cov.has_sales ? '매출 ' + fmt(cov.sales_dongs) + '개 동' : '매출 없음',
    cov.has_reference_sales ? '참고매출 ' + (cov.reference_sales_scopes || []).join('/') : '',
    cov.has_stores ? '점포 ' + fmt(cov.store_dongs) + '개 동' : '점포 없음',
    cov.has_map_points ? '지도핀 ' + fmt(cov.map_points) + '개' : '지도핀 없음'
  ].filter(Boolean) : ['자료 확인 중'];
  coverageBox.className = 'coverage-box ' + coverageClass(cov);
  coverageBox.innerHTML =
    '<span>데이터 상태</span>' +
    '<b>' + escapeHtml(coverageLabel(cov)) + '</b>' +
    '<p>' + escapeHtml(parts.join(' · ')) + '</p>' +
    '<small>' + escapeHtml(coverageAction(cov)) + '</small>';
}

function applyBusinessTypes(){
  const types = Array.isArray(DATA.view && DATA.view.business_types) ? DATA.view.business_types : [];
  for (const item of types){
    if (BIZ[item.id]){
      if (item.reference_sales) BIZ[item.id].reference_sales = item.reference_sales;
      continue;
    }
    BIZ[item.id] = {
      label: item.label,
      words: item.words || [item.label],
      demand: ['유동인구', '직장인구', '상주인구', '소비지출'],
      caution: serviceCaution(item.label),
      kind: item.kind,
      code: item.code,
      reference_sales: item.reference_sales || null
    };
    if (item.reference_sales) BIZ[item.id].reference_sales = item.reference_sales;
  }
  const groupOrder = ['추천 업종', '매출 자료 있는 업종', '매출 자료 없는 업종'];
  const byGroup = new Map();
  for (const item of types){
    const cov = coverageFor(item.id);
    let group = item.group || (item.kind === 'service' ? '전체 업종' : '추천 업종');
    if (group === '전체 업종'){
      group = cov && cov.has_sales ? '매출 자료 있는 업종' : '매출 자료 없는 업종';
    }
    if (!byGroup.has(group)) byGroup.set(group, []);
    byGroup.get(group).push(item);
  }
  if (!types.length){
    byGroup.set('추천 업종', Object.keys(BIZ).map(id => ({id, label: BIZ[id].label})));
  }
  biz.innerHTML = groupOrder.concat([...byGroup.keys()].filter(g => !groupOrder.includes(g))).filter(g => byGroup.has(g)).map(group => {
    const options = byGroup.get(group).map(item => {
      const cov = coverageFor(item.id);
      const mark = cov && !cov.has_sales ? ' · 점포/지도 중심' : '';
      return '<option value="' + escapeHtml(item.id) + '">' + escapeHtml(item.label + mark) + '</option>';
    }).join('');
    return '<optgroup label="' + escapeHtml(group) + '">' + options + '</optgroup>';
  }).join('');
  if (!BIZ[state.biz]) state.biz = 'cafe';
}

function applyDongOptions(){
  const select = document.getElementById('dongPick');
  if (!select || !DATA.view || !Array.isArray(DATA.view.rows)) return;
  select.innerHTML = '<option value="">전체 행정동</option>' + DATA.view.rows
    .slice()
    .sort((a, b) => (a.gu + a.name).localeCompare(b.gu + b.name, 'ko'))
    .map(row => '<option value="' + escapeHtml(row.code) + '">' + escapeHtml(row.gu + ' ' + row.name) + '</option>')
    .join('');
  select.value = state.dong || '';
}

async function loadJson(name){
  const res = await fetch('data/' + name + '?v=' + V, {cache:'no-store'});
  if (!res.ok) throw new Error(name);
  return res.json();
}

function latestRows(payload){
  return payload && Array.isArray(payload.rows) ? payload.rows : [];
}

function norm(v, min, max, inverse){
  if (v === null || v === undefined || !Number.isFinite(v)) return 0;
  if (max <= min) return 50;
  const p = Math.max(0, Math.min(100, ((v - min) / (max - min)) * 100));
  return inverse ? 100 - p : p;
}

function level(value, rows, key, high, mid, low){
  const vals = rows.map(r => r[key]).filter(v => Number.isFinite(v));
  if (!Number.isFinite(value) || vals.length < 3) return low;
  vals.sort((a, b) => a - b);
  const top = vals[Math.floor(vals.length * .75)];
  const middle = vals[Math.floor(vals.length * .45)];
  if (value >= top) return high;
  if (value >= middle) return mid;
  return low;
}

function median(rows, key){
  const vals = rows.map(r => r[key]).filter(v => Number.isFinite(v)).sort((a, b) => a - b);
  if (!vals.length) return 0;
  return vals[Math.floor(vals.length / 2)];
}

function buildRows(){
  const base = latestRows(DATA.view).map(src => {
    const biz = (src.biz && src.biz[state.biz]) || {};
    const demand = (src.floating || 0) + (src.workers || 0) * 800 + (src.residents || 0) * 250;
    const unitPrice = biz.sales && biz.sales_count ? Math.round(biz.sales / biz.sales_count) : null;
    return {
      code: src.code, gu: src.gu, name: src.name, full_name: src.full_name,
      floating: src.floating || null,
      lunch_flow: src.lunch_flow || null,
      evening_flow: src.evening_flow || null,
      workers: src.workers || null,
      residents: src.residents || null,
      households: src.households || null,
      core_people: src.core_people || null,
      spending: src.spending || null,
      food_spending: src.food_spending || null,
      education_spending: src.education_spending || null,
      leisure_spending: src.leisure_spending || null,
      sales: biz.sales || null,
      sales_month: biz.sales ? Math.round(biz.sales / 3) : null,
      sales_count: biz.sales_count || null,
      unit_price: unitPrice,
      stores: biz.stores || null,
      sales_per_store: biz.sales && biz.stores ? Math.round(biz.sales / biz.stores) : null,
      sales_per_store_month: biz.sales && biz.stores ? Math.round(biz.sales / biz.stores / 3) : null,
      franchises: biz.franchises || null,
      open: biz.open || null,
      close: biz.close || null,
      market_change: src.market_change || null,
      apartment: src.apartment || null,
      facilities: src.facilities || null,
      demand_raw: demand,
      sales_items: biz.sales_items || [],
      store_items: biz.store_items || [],
      reference_sales: biz.reference_sales || null
    };
  });

  const ranges = {};
  ['demand_raw','sales','stores','spending','core_people','workers','residents'].forEach(k => {
    const vals = base.map(r => r[k]).filter(v => Number.isFinite(v));
    ranges[k] = {min: Math.min(...vals), max: Math.max(...vals)};
  });
  base.forEach(r => {
    const demand = norm(r.demand_raw, ranges.demand_raw.min, ranges.demand_raw.max);
    const revenue = norm(r.sales || 0, ranges.sales.min, ranges.sales.max);
    const spending = norm(r.spending || 0, ranges.spending.min, ranges.spending.max);
    const competition = norm(r.stores || 0, ranges.stores.min, ranges.stores.max, true);
    r.competition_score = Math.round(competition);
    r.score = Math.round(demand * .32 + revenue * .28 + spending * .18 + competition * .22);
  });
  ROWS = base;
}

function dataAlert(){
  const missing = Object.entries(FILES)
    .filter(([k]) => k === 'view')
    .filter(([k]) => !DATA[k] || !latestRows(DATA[k]).length)
    .map(([k, f]) => f);
  if (!missing.length){ alert.hidden = true; return; }
  alert.hidden = false;
  alert.innerHTML = '<b>아직 생성되지 않은 화면용 자동갱신 파일이 있습니다.</b><br>' +
    'GitHub Actions의 <b>Update Living Population</b>을 실행하면 채워집니다. 현재 화면은 이미 있는 데이터만으로 보여줍니다.<br>' +
    '<small>' + missing.join(' · ') + '</small>';
}

function renderSummary(rows){
  const b = BIZ[state.biz];
  const period = quarterLabel(DATA.view && DATA.view.quarter);
  const cov = coverageFor();
  const salesOk = hasSalesData();
  const mapOk = hasMapData();
  const meta = businessMeta();
  const ref = (BIZ[state.biz] && BIZ[state.biz].reference_sales) || meta.reference_sales;
  document.querySelectorAll('.commercial-insight').forEach(el => el.remove());
  const best = salesOk ? rows[0] : rows.slice().sort((a, z) => (z.stores || 0) - (a.stores || 0))[0];
  const validStoreRows = rows.filter(r => r.stores);
  const lowComp = (validStoreRows.length ? validStoreRows : rows).slice().sort((a, z) => (z.competition_score || 0) - (a.competition_score || 0) || (z.sales_per_store_month || 0) - (a.sales_per_store_month || 0))[0];
  const highDemand = rows.slice().sort((a, z) => ((z.residents || 0) + (z.workers || 0)) - ((a.residents || 0) + (a.workers || 0)))[0];
  const rowSalesNote = row => {
    if (row.sales_per_store_month) return '가게당 월매출 ' + money(row.sales_per_store_month);
    if (row.reference_sales && row.reference_sales.monthly_sales_per_store) return row.reference_sales.scope + ' 참고 ' + money(row.reference_sales.monthly_sales_per_store);
    return '매출 자료 없음';
  };
  const card = (title, row, desc, cls) => row ? '<button type="button" class="insight-card ' + (cls || '') + '" data-pick="' + row.code + '">' +
    '<span>' + title + '</span><b>' + row.gu + ' ' + row.name + '</b><p>' + desc + '</p>' +
    '<small>' + rowSalesNote(row) + ' · 점포 ' + fmt(row.stores) + '곳</small></button>' : '';
  const status = cov ? coverageLabel(cov) : [
    salesOk ? '매출자료 있음' : '매출자료 없음',
    mapOk ? '지도핀 ' + fmt(cov && cov.map_points) + '개' : '지도핀 없음'
  ].filter(Boolean).join(' · ');
  summary.innerHTML = '';
  const insight = document.createElement('section');
  insight.className = 'commercial-insight';
  insight.innerHTML =
    '<div class="insight-title"><b>먼저 볼 동네</b><span>카드를 누르면 아래 내용이 바뀝니다.</span></div>' +
    '<div class="insight-grid">' +
      card(salesOk ? '돈이 크게 도는 곳' : '가게가 많이 모인 곳', best, salesOk ? '같은 업종 가게 1곳의 월매출이 가장 높게 잡힌 동네입니다.' : '매출 자료가 없어 같은 업종 가게가 많이 모인 곳부터 봅니다.', '') +
      card('경쟁이 덜한 곳', lowComp, '같은 업종 가게가 상대적으로 적은 동네입니다.', 'niche') +
      card('수요 기반이 큰 곳', highDemand, '거주인구와 직장인구가 많은 동네입니다.', 'risk') +
    '</div>';
  summary.insertAdjacentElement('afterend', insight);
  for (const el of insight.querySelectorAll('[data-pick]')){
    el.onclick = () => { state.picked = el.dataset.pick; render(); };
  }
}

function demandType(r){
  const worker = r.workers || 0;
  const resident = r.residents || 0;
  if (worker > resident * 2) return '직장 수요형';
  if (resident > worker * 2) return '주거 수요형';
  return '혼합 수요형';
}

function demandTone(r){
  const type = demandType(r);
  if (type === '직장 수요형') return '평일 점심·퇴근 시간대 수요를 먼저 봐야 하는 동네입니다.';
  if (type === '주거 수요형') return '동네 거주민의 반복 방문과 저녁·주말 수요를 먼저 봐야 하는 동네입니다.';
  return '직장·주거 수요가 섞여 있어 시간대별 운영 전략을 나눠 봐야 하는 동네입니다.';
}

function scoreGuide(r){
  if ((r.score || 0) >= 70) return '서울 행정동 중 매출·수요·경쟁 조건이 함께 강한 후보입니다.';
  if ((r.score || 0) >= 45) return '조건은 보통 이상입니다. 실제 임대료와 보행 동선을 같이 보면 판단이 쉬워집니다.';
  return '한두 지표만 보고 들어가기보다 현장 조건을 먼저 확인해야 하는 후보입니다.';
}

function competitionGuide(r){
  if (!r.stores) return '선택 업종 점포 수가 낮게 잡혀 실제 영업점 확인이 필요합니다.';
  if (r.competition_score >= 70) return '선택 업종 점포 부담이 낮은 편입니다. 단, 수요가 충분한지 같이 봐야 합니다.';
  if (r.competition_score >= 35) return '경쟁은 보통 수준입니다. 상권 안쪽 위치 차이가 결과를 크게 가를 수 있습니다.';
  return '선택 업종 점포가 많은 편입니다. 가격·콘셉트·노출 위치로 이길 수 있는지 먼저 봐야 합니다.';
}

function marketChangeTone(r){
  const m = r.market_change;
  if (!m || !m.name) return '상권 변화지표가 아직 연결되지 않았습니다.';
  const base = '운영 지속기간 평균 ' + fmt(m.operation_months) + '개월, 폐업 점포 영업기간 평균 ' + fmt(m.close_months) + '개월 기준입니다.';
  if (m.name.includes('확장')) return '상권이 커지는 쪽으로 분류된 동네입니다. 신규 진입 기회와 임대료 상승 가능성을 같이 봐야 합니다. ' + base;
  if (m.name.includes('정체')) return '상권 규모가 크게 움직이지 않는 쪽입니다. 새로움보다 고정 수요와 운영 안정성이 중요합니다. ' + base;
  if (m.name.includes('축소') || m.name.includes('쇠퇴')) return '상권 힘이 약해지는 신호가 있어 보수적으로 봐야 합니다. ' + base;
  return base;
}

function marketChangeLabel(r){
  const name = r.market_change && r.market_change.name;
  if (!name) return '자료 없음';
  if (name.includes('다이나믹')) return '변화 큰 상권';
  if (name.includes('정체')) return '안정·정체 상권';
  if (name.includes('확장')) return '확장 상권';
  if (name.includes('축소') || name.includes('쇠퇴')) return '위축 상권';
  return name;
}

function apartmentTone(r){
  const a = r.apartment;
  if (!a) return '아파트 자료가 아직 연결되지 않았습니다.';
  const high = a.high_price_households ? '고가 단지 세대 ' + fmt(a.high_price_households) + '세대가 포함됩니다. ' : '';
  return '아파트 단지 ' + fmt(a.complexes) + '개, 평균 면적 ' + fmt(a.average_area) + '㎡, 평균 시세 ' + money(a.average_market_price) + ' 수준입니다. ' + high + '주거 반복 수요와 손님 결제 여력을 볼 때 참고합니다.';
}

function facilityTone(r){
  const f = r.facilities;
  if (!f) return '집객시설 자료가 아직 연결되지 않았습니다.';
  const transit = [f.subway_stations ? '지하철 ' + fmt(f.subway_stations) + '곳' : '', f.bus_stops ? '버스정류장 ' + fmt(f.bus_stops) + '곳' : ''].filter(Boolean).join(' · ');
  const base = '집객시설 ' + fmt(f.total) + '개' + (transit ? ', ' + transit : '') + ' 기준입니다.';
  if ((f.schools || 0) >= 5) return base + ' 학교·교육시설이 많은 편이라 학원, 간식, 생활형 업종에서 추가로 볼 만합니다.';
  if ((f.hospitals || 0) || (f.pharmacies || 0)) return base + ' 병원·약국 주변 반복 방문 수요를 같이 확인할 만합니다.';
  return base + ' 지도에서 실제 보행 동선과 시설 위치가 이어지는지 확인해야 합니다.';
}

function filteredRows(){
  const q = state.q.trim();
  let out = ROWS;
  if (state.dong) out = out.filter(r => r.code === state.dong);
  if (q) out = out.filter(r => (r.full_name + ' ' + r.gu + ' ' + r.name).includes(q));
  out = out.filter(r => r.score || r.sales || r.stores || r.floating || r.workers || r.residents);
  const key = state.sort;
  out = out.slice().sort((a, b) => (b[key] || 0) - (a[key] || 0) || a.code.localeCompare(b.code));
  return out;
}

function rowHtml(r, i){
  const active = state.picked === r.code ? ' active' : '';
  const storeLabel = r.stores ? '가게 ' + fmt(r.stores) + '곳' : '가게 수 자료 없음';
  const salesOk = hasSalesData();
  const salesValue = r.sales_per_store_month || (r.reference_sales && r.reference_sales.monthly_sales_per_store);
  const salesLabel = r.sales_per_store_month
    ? BIZ[state.biz].label + ' 가게당 월매출'
    : (r.reference_sales ? r.reference_sales.scope + ' 가게당 참고 월매출' : '매출 미제공');
  return '<button type="button" class="commercial-row' + active + '" data-code="' + r.code + '">' +
    '<span class="rank">' + (i + 1) + '</span>' +
    '<span class="place"><b>' + r.gu + ' ' + r.name + '</b><small>' + r.code + ' · ' + storeLabel + '</small></span>' +
    '<span><b>' + (salesValue ? money(salesValue) : '자료 없음') + '</b><small>' + salesLabel + '</small></span>' +
    '<span><b>' + fmt(r.stores) + '</b><small>같은 업종 가게</small></span>' +
    '<span><b>' + demandType(r) + '</b><small>손님이 생기는 이유</small></span>' +
    '<span><b>' + fmt(r.score) + '</b><small>후보 점수</small></span>' +
  '</button>';
}

function explainRow(r, rows){
  const b = BIZ[state.biz];
  const bits = [
    level(r.sales, rows, 'sales', '선택 업종 매출이 서울 상위권입니다', '선택 업종 매출이 중상위권입니다', '선택 업종 매출 신호는 약합니다'),
    level(r.workers, rows, 'workers', '직장인구가 많아 평일 수요가 강합니다', '직장인구가 일정 수준 있습니다', '직장인구 신호는 약합니다'),
    level(r.residents, rows, 'residents', '상주인구 기반 수요도 큽니다', '상주인구 기반 수요가 보통입니다', '상주인구 기반 수요는 제한적입니다')
  ];

const PLACE_CACHE = {};
let kakaoReady = false, commercialMap = null, commercialOverlays = [], commercialMapKey = '';

function cleanPlaceName(v){
  return (v || '').replace(/[^0-9A-Za-z가-힣]+/g, '');
}

function legalDongName(name){
  return (name || '').replace(/(\d+(?:\.\d+)*)동$/, '동');
}

function storeDongKeys(row){
  const names = [row.name, legalDongName(row.name)];
  return [...new Set(names.map(name => row.gu + '/' + name))];
}

function placeFileFor(row){
  const idx = DATA.places && DATA.places.dongs ? DATA.places.dongs : {};
  const names = [row.name, legalDongName(row.name)];
  for (const name of names){
    const key = '서울/' + row.gu + '/' + name;
    if (idx[key] && idx[key].f) return idx[key].f + '.json';
  }
  return cleanPlaceName('서울') + '_' + cleanPlaceName(row.gu) + '_' + cleanPlaceName(legalDongName(row.name)) + '.json';
}

function loadKakao(){
  return new Promise((resolve, reject) => {
    if (kakaoReady) return resolve();
    if (!window.kakao || !window.kakao.maps) return reject(new Error('sdk'));
    kakao.maps.load(() => { kakaoReady = true; resolve(); });
  });
}

function loadPlaces(row){
  const file = placeFileFor(row);
  if (PLACE_CACHE[file]) return Promise.resolve(PLACE_CACHE[file]);
  return fetch('data/places/' + encodeURIComponent(file) + '?v=' + V, {cache:'no-store'})
    .then(r => r.ok ? r.json() : null)
    .then(d => (PLACE_CACHE[file] = d))
    .catch(() => null);
}

function clearCommercialMap(){
  for (const o of commercialOverlays) o.setMap(null);
  commercialOverlays = [];
}

function mapKind(p){
  if (p.t === 'b') return 'business';
  if (p.t === 's') return 'school';
  if (p.t === 'a') return 'academy';
  if (p.t === 'p') return 'apartment';
  if (p.t === 'g') return 'shop';
  return '';
}

function markerClass(p){
  if (p.t === 'b') return 'b1';
  if (p.t === 's') return p.k === '중학교' ? 'm' : 'e';
  if (p.t === 'a') return p.k === '교습소' ? 'a3' : (p.k === '영어+타 과목' ? 'a2' : 'a1');
  if (p.t === 'p') return 'p3';
  if (p.t === 'g') return 'g3';
  return 'a1';
}

function markerCard(p){
  if (p.t === 'b'){
    if (Array.isArray(p.members) && p.members.length > 1){
      const list = p.members.map(item =>
        '<div class="li"><u>' + item.n + '</u>' +
          '<small>' + [item.c || BIZ[state.biz].label, item.a || ''].filter(Boolean).join(' · ') + '</small></div>'
      ).join('');
      const salesNote = p.sales_note ? '<span><b>매출 기준</b> ' + p.sales_note + '</span>' : '';
      return '<b>같은 위치 ' + p.members.length + '곳</b>' + salesNote + list;
    }
    const meta = [
      '<span><b>업종</b> ' + (p.c || BIZ[state.biz].label) + '</span>',
      p.sales_note ? '<span><b>매출 기준</b> ' + p.sales_note + '</span>' : '',
      p.a ? '<span><b>주소</b> ' + p.a + '</span>' : ''
    ].filter(Boolean).join('');
    return '<b>' + p.n + '</b>' + meta;
  }
  const sub = [];
  if (p.t === 's') sub.push(p.k, p.st ? '학생 ' + fmt(p.st) + '명' : '');
  if (p.t === 'a') sub.push(p.k, p.y ? p.y + '년 개원' : '', p.f ? '월 ' + Math.round(p.f / 10000) + '만원' : '');
  if (p.t === 'p') sub.push('아파트', p.y ? p.y + '년' : '', p.p ? '중간가 ' + money(p.p) : '');
  if (p.t === 'g') sub.push('상가', p.k, p.ar ? Math.round(p.ar / 3.3) + '평' : '');
  return '<b>' + p.n + '</b>' + sub.filter(Boolean).map(v => '<span>' + v + '</span>').join('');
}

function mapSelectionTitle(p){
  if (!p) return '지도 핀을 눌러보세요';
  if (p.t === 'b') return p.count > 1 ? '같은 위치 ' + p.members.length + '곳' : '선택한 가게';
  if (p.t === 'p') return '선택한 아파트';
  if (p.t === 'g') return '선택한 상가';
  if (p.t === 'a') return '선택한 학원';
  return '선택한 장소';
}

function setMapSelection(p){
  const panel = document.getElementById('mapSelection');

function businessPoints(row){
  const all = DATA.stores && DATA.stores.points ? DATA.stores.points : {};
  const salesNote = row.sales_per_store_month
    ? '개별 가게 매출 아님 · 이 동네 ' + BIZ[state.biz].label + ' 가게 1곳의 한 달 평균 매출 ' + money(row.sales_per_store_month)
    : (row.reference_sales && row.reference_sales.monthly_sales_per_store
      ? '개별 가게 매출 아님 · ' + row.reference_sales.scope + ' 기준 가게 1곳의 한 달 참고 매출 ' + money(row.reference_sales.monthly_sales_per_store)
      : '');
  for (const key of storeDongKeys(row)){
    const bucket = all[key] && all[key][state.biz];
    if (Array.isArray(bucket) && bucket.length){
      return bucket.map(p => ({...p, t: 'b', k: state.biz, sales_note: salesNote}));
    }
  }
  return [];
}

function groupBusinessPoints(points){
  const byCoord = new Map();
  for (const p of points){
    const key = [Number(p.lat).toFixed(6), Number(p.lng).toFixed(6)].join(',');
    if (!byCoord.has(key)){
      byCoord.set(key, {...p, members: [], n: p.n});
    }
    byCoord.get(key).members.push(p);
  }
  return [...byCoord.values()].map(p => {
    if (p.members.length > 1){
      p.n = '같은 위치 ' + p.members.length + '곳';
      p.c = BIZ[state.biz].label;
      p.a = p.members[0].a || '';
      p.count = p.members.length;
    }
    return p;
  });
}

function drawCommercialMap(row, keepView){
  const box = document.getElementById('map');
  if (!box) return;
  if (box.dataset.built !== '1') box.innerHTML = '<div class="mapmsg">불러오는 중...</div>';
  loadPlaces(row).then(data => {
    const bizRawPts = businessPoints(row);
    const bizPts = groupBusinessPoints(bizRawPts);
    if ((!data || !Array.isArray(data.items) || !data.items.length) && !bizPts.length){
      box.innerHTML = '<div class="mapmsg">이 동네에 연결된 지도 지점이 없습니다.<br>다른 행정동을 눌러보세요.</div>';
      const count = document.getElementById('mapcount');
      if (count) count.textContent = '';
      return;
    }
    return loadKakao().then(() => {
      const contextItems = data && Array.isArray(data.items) ? data.items : [];
      const context = contextItems.filter(p => p.t === 'p' || p.t === 'g' || (state.biz === 'academy' && p.t === 'a'));
      const pts = bizPts.concat(context).filter(p => state.show[mapKind(p)] !== false);
      if (!pts.length){
        clearCommercialMap();
        const count = document.getElementById('mapcount');
        if (count) count.textContent = '표시할 핀이 없습니다';
        setMapSelection(null);
        return;
      }
      const key = (data ? data.sido + '/' + data.gusi + '/' + data.dong : '') || row.gu + '/' + row.name;
      const lat = pts.reduce((s, p) => s + p.lat, 0) / pts.length;
      const lng = pts.reduce((s, p) => s + p.lng, 0) / pts.length;
      if (!commercialMap || box.dataset.built !== '1'){
        box.innerHTML = '';
        commercialMap = new kakao.maps.Map(box, {center: new kakao.maps.LatLng(lat, lng), level: 5});
        commercialMap.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
        kakao.maps.event.addListener(commercialMap, 'click', () => {
          for (const el of box.querySelectorAll('.mk.open')) el.classList.remove('open');
          setMapSelection(null);
        });
        box.dataset.built = '1';
      }
      clearCommercialMap();
      setMapSelection(null);
      const bounds = new kakao.maps.LatLngBounds();
      for (const p of pts){
        const pos = new kakao.maps.LatLng(p.lat, p.lng);
        bounds.extend(pos);
        const el = document.createElement('div');
        el.className = 'mk ' + markerClass(p);
        if (p.count > 1) el.dataset.n = p.count;
        el.tabIndex = 0;
        el.setAttribute('aria-label', p.n || '지도 지점');
        el.innerHTML = '';
        const overlay = new kakao.maps.CustomOverlay({position: pos, content: el, yAnchor: 1, clickable: true, zIndex: 2});
        overlay.setMap(commercialMap);
        commercialOverlays.push(overlay);
        el.onclick = () => {
          for (const item of box.querySelectorAll('.mk.open')) item.classList.remove('open');
          el.classList.add('open');
          setMapSelection(p);
        };
        el.onkeydown = ev => {
          if (ev.key === 'Enter' || ev.key === ' '){
            ev.preventDefault();
            el.click();
          }
        };
      }
      if (!keepView || commercialMapKey !== key) commercialMap.setBounds(bounds, 40, 40, 40, 40);
      commercialMapKey = key;
      const count = document.getElementById('mapcount');
      if (count){
        const n = t => pts.filter(p => p.t === t).length;
        const bizLabel = BIZ[state.biz].label + ' 좌표 ' + n('b') + '곳' +
          (row.stores ? ' / 집계 ' + fmt(row.stores) + '곳' : '') +
          (bizRawPts.length && bizRawPts.length !== n('b') ? ' · 실제 점포 ' + bizRawPts.length + '곳' : '');
        const missingBiz = bizPts.length ? '' : ' · 선택 업종 좌표 없음';
        count.textContent = [
          bizLabel,
          state.biz === 'academy' ? '학원참고 ' + n('a') : '',
          '아파트 ' + n('p'),
          '상가 ' + n('g')
        ].filter(Boolean).join(' · ') + missingBiz;
      }
    });
  }).catch(() => {
    box.innerHTML = '<div class="mapmsg">지도를 불러오지 못했습니다.<br>카카오 지도 키 또는 네트워크 상태를 확인해주세요.</div>';
  });
}

  const rows = filteredRows();
  const currentSort = SORTS.find(it => it.k === state.sort) || SORTS[0];
  sortHelp.textContent = !hasSalesData() && currentSort.k === 'stores'
    ? salesMissingText() + ' 지금은 점포 수 기준으로 보여줍니다.'
    : currentSort.help;
  renderSummary(rows);
  dataAlert();
  const list = rows.slice(0, 10);
  table.innerHTML = '<div class="commercial-head"><span></span><span>동네</span><span>가게당 월매출</span><span>같은 업종 가게</span><span>수요 유형</span><span>후보 점수</span></div>' +
    (list.length ? list.map(rowHtml).join('') : '<div class="none">조건에 맞는 행정동이 없습니다.</div>');
  for (const el of table.querySelectorAll('.commercial-row')){
    el.onclick = () => { state.picked = el.dataset.code; render(); };
  }
  renderDetail(rows);
}

sortPick.innerHTML = SORTS.map(it => '<option value="' + it.k + '">' + it.l + '</option>').join('');
sortPick.onchange = e => { state.sort = e.target.value; state.picked = ''; render(); };
dongPick.onchange = e => { state.dong = e.target.value; state.q = ''; state.picked = e.target.value; render(); };
biz.onchange = e => {
  state.biz = e.target.value;
  state.picked = '';
  buildRows();
  if (!hasSalesData() && state.sort === 'sales_per_store_month') state.sort = 'stores';
  render();
};
q.oninput = e => { state.q = e.target.value; state.picked = ''; render(); };

Promise.all(Object.entries(FILES).map(([key, file]) =>
  loadJson(file).then(v => { DATA[key] = v; }).catch(() => {})
)).then(() => {
  if (!DATA.view){
    alert.hidden = false;
    alert.innerHTML = '<b>상권 화면용 데이터가 없습니다.</b><br>먼저 <code>web/data/commercial-view-dong.json</code>을 생성해야 합니다.';
    return;
  }
  applyBusinessTypes();
  applyDongOptions();
  buildRows();
  render();
});
</script>
<script src="dates.js?v=75"></script>
</body>
</html>
